<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PACE Sponsorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PACE Sponsorer">
<meta name="theme-color" content="#0A0F1C">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;700&family=Big+Shoulders+Display:wght@800;900&display=swap">
<style>
/* Layout: helskärm för TV (16:9). Växlar mellan alla sponsorer och en sponsor i taget. Ett mörkt tema som i tidtagningen. */
:root{
  --ink:#0A0F1C; --panel:#111a2c; --line:#25314c; --text:#eef2fa; --muted:#8e9bb8; --accent:#3ba7e6; --go:#3be08a;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --u:min(1vw,1.78vh);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(80% 70% at 50% 35%, #16233d 0%, var(--ink) 75%) fixed, var(--ink);color:var(--text);font-family:var(--font-body);overflow:hidden;cursor:none}
.stage{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:calc(var(--u)*3) max(calc(var(--u)*4),env(safe-area-inset-right,0px)) calc(var(--u)*2.6) max(calc(var(--u)*4),env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2)}
.brand{display:flex;align-items:center;gap:calc(var(--u)*1.8)}
.brand img{height:calc(var(--u)*6.5);width:auto}
.brand span{border-left:1px solid var(--line);padding-left:calc(var(--u)*1.8);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:calc(var(--u)*1.2);color:var(--muted);line-height:1.5;white-space:nowrap}
.clock{font-family:var(--font-num);font-weight:700;font-size:calc(var(--u)*5);line-height:1;font-variant-numeric:tabular-nums}
.body{position:relative;min-height:0}
.slide{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:min(calc(var(--u)*2.4),3vh);padding-block:2vh;opacity:0;transform:scale(.97);transition:opacity .9s ease,transform 1.2s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.slide.on{opacity:1;transform:none}
.title{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:min(calc(var(--u)*5),8vh);letter-spacing:.02em;line-height:1;text-align:center;text-wrap:balance}
.grid{display:flex;flex-wrap:wrap;justify-content:center;--g:min(calc(var(--u)*2),2.6vh);gap:var(--g);width:min(100%,calc(var(--u)*120))}
.tile{flex:0 0 calc((100% - 3 * var(--g)) / 4);display:flex;align-items:center;justify-content:center;height:min(calc(var(--u)*15),22vh);padding:calc(var(--u)*2.2);background:#fff;border-radius:calc(var(--u)*1.6);box-shadow:0 calc(var(--u)*1) calc(var(--u)*4) rgba(0,0,0,.45)}
.tile img{display:block;max-width:100%;max-height:100%;width:auto;height:100%;object-fit:contain}
.slide.on .tile{animation:pop .8s cubic-bezier(.2,1.25,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(calc(var(--u)*2)) scale(.94)}to{opacity:1;transform:none}}
.solo .card{display:flex;align-items:center;justify-content:center;width:min(78vw,calc(var(--u)*90));height:min(40vh,calc(var(--u)*40));padding:calc(var(--u)*5);background:#fff;border-radius:calc(var(--u)*2.4);box-shadow:0 calc(var(--u)*2) calc(var(--u)*7) rgba(0,0,0,.5)}
.solo .card img{display:block;max-width:100%;max-height:100%;width:auto;height:100%;object-fit:contain}
.solo .lbl{font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:calc(var(--u)*1.5);color:var(--muted)}
.solo .name{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:min(calc(var(--u)*4),7vh);line-height:1}
.foot{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2);color:var(--muted);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:calc(var(--u)*1.2)}
.dots{display:flex;gap:calc(var(--u)*.8)}
.dots i{width:calc(var(--u)*1);height:calc(var(--u)*1);border-radius:50%;background:var(--line);transition:background .4s,transform .4s}
.dots i.on{background:var(--accent);transform:scale(1.3)}
.prog{flex:1;max-width:30%;height:calc(var(--u)*.45);border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.dk{background:#000!important}
.wm{font-family:var(--font-display);font-weight:900;color:#0a0f1c;letter-spacing:.06em;line-height:1;font-size:min(calc(var(--u)*6),9vh)}
.solo .card .wm{font-size:min(calc(var(--u)*16),24vh)}
.hint{position:fixed;left:50%;bottom:calc(var(--u)*2);transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;transition:opacity .5s;cursor:default}
@media (max-aspect-ratio:1/1){.tile{flex-basis:calc((100% - var(--g)) / 2)}.tile{height:min(calc(var(--u)*24),15vh)}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){.slide,.slide.on .tile{transition:opacity .3s;animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <div class="brand"><img src="assets/pace.png" alt="PACE Performance &amp; Training"><span>HYROX Simulation<br>Official HYROX Training Club</span></div>
    <div class="clock" id="clock">00:00</div>
  </div>
  <div class="body" id="body"></div>
  <div class="foot">
    <div class="dots" id="dots"></div>
    <div class="prog"><i id="prog"></i></div>
    <span>Tack för att ni gör eventet möjligt</span>
  </div>
</div>
<div class="hint" id="hint">Tryck för helskärm</div>

<script>
(() => {
'use strict';
const SPONSORS = [
  { name:'Björn Borg', src:'assets/bjornborg.jpg' },
  { name:'Kraftmark', src:'assets/kraftmark.jpg' },
  { name:'Ramudden', src:'assets/ramudden.jpg' },
  { name:'NOCCO', src:'assets/nocco.jpg' },
  { name:'Toveks Bil', src:'assets/toveks.jpg' },
  { name:'Hajen Lågpris', src:'assets/hajen.jpg' },
  { name:'ZUP Burger', src:'assets/zup.jpg', dark:true },   // vit logga – visas på svart bricka
];
const GRID_MS = 12000, SOLO_MS = 6000;   // alla sponsorer 12 s, sedan varje sponsor 6 s, och om igen
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const logo = x => x.src ? `<img src="${x.src}" alt="${esc(x.name)}">` : `<b class="wm">${esc(x.text || x.name)}</b>`;   // text tills loggan finns
const pad = n => String(n).padStart(2, '0');

// Bygg bilderna: rutnät + en bild per sponsor
const slides = [{ ms:GRID_MS, html:`<div class="title">Tack till våra sponsorer</div><div class="grid">${SPONSORS.map((x, i) => `<div class="tile${x.dark ? ' dk' : ''}" style="animation-delay:${.1 + i * .15}s">${logo(x)}</div>`).join('')}</div>` }]
  .concat(SPONSORS.map(x => ({ ms:SOLO_MS, solo:true, html:`<div class="lbl">Sponsor</div><div class="card${x.dark ? ' dk' : ''}">${logo(x)}</div><div class="name">${esc(x.name)}</div>` })));
const body = document.getElementById('body');
body.innerHTML = slides.map(s => `<div class="slide ${s.solo ? 'solo' : ''}">${s.html}</div>`).join('');
const els = [...body.children];
document.getElementById('dots').innerHTML = slides.map(() => '<i></i>').join('');
const dots = [...document.getElementById('dots').children];

let idx = -1, t0 = 0;
function next() {
  idx = (idx + 1) % slides.length;
  els.forEach((e, i) => e.classList.toggle('on', i === idx));
  dots.forEach((d, i) => d.classList.toggle('on', i === idx));
  t0 = Date.now();
}
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const p = (Date.now() - t0) / slides[idx].ms;
  document.getElementById('prog').style.width = Math.min(100, p * 100).toFixed(1) + '%';
  if (p >= 1) next();
}
next(); tick(); setInterval(tick, 250);

// Helskärm vid tryck (där webbläsaren tillåter), håll skärmen vaken
const hint = document.getElementById('hint');
setTimeout(() => hint.style.opacity = 0, 6000);
document.addEventListener('click', () => {
  hint.style.opacity = 0;
  const d = document.documentElement;
  (d.requestFullscreen || d.webkitRequestFullscreen)?.call(d)?.catch?.(() => {});
});
const wake = () => navigator.wakeLock?.request('screen').catch(() => {});
wake(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
})();
</script>
</body>
</html>
