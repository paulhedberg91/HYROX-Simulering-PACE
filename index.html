<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PACE HYROX Tidtagning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HYROX Tid">
<meta name="theme-color" content="#0A0F1C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: tidtagarens arbetsyta på iPad. Stora tryckytor, ett mörkt tema (används i gymlokal), PACE-blå accent. */
:root{
  --ink:#0A0F1C; --panel:#111a2c; --panel-2:#172238; --line:#25314c;
  --text:#eef2fa; --muted:#8e9bb8;
  --accent:#3ba7e6; --accent-ink:#06121f;
  --go:#3be08a; --go-ink:#04140b; --warn:#ffcf4a; --danger:#ff5d6c;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:20px;flex:none}
.plogo{height:44px;width:auto;flex:none}
@media (max-width:560px){.plogo{height:32px}}
.brand h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.clock{font-family:var(--font-num);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);padding:10px 16px;border-radius:999px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:44px}
.tab[aria-selected="true"]{background:var(--text);color:var(--ink)}
.tab .cnt{display:inline-block;min-width:1.6em;padding:0 .4em;margin-left:6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;text-align:center}

main.wrap{padding-block:20px 90px;display:grid;gap:20px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:24px;line-height:1}
.sec-h p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:65ch}
.eyebrow{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--danger)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.big{min-height:64px;font-size:20px;padding:12px 26px;border-radius:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.run{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.done{border-color:var(--go);color:var(--go)}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:0;max-width:70ch}
.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}

/* Nästa start */
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.next .tm{font-family:var(--font-num);font-weight:700;font-size:56px;line-height:.9;font-variant-numeric:tabular-nums}
.next h3{margin:0;font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:30px;line-height:1}
.next .who{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.next .who span{font-size:14px;padding:4px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.next .who b{color:var(--accent);font-family:var(--font-num);margin-right:4px}
.next .acts{display:grid;gap:10px}
.due{display:grid;gap:8px;margin-top:12px}
.due .big{font-family:var(--font-num);font-weight:700;font-size:72px;line-height:.85;color:var(--accent);font-variant-numeric:tabular-nums}
.due .big.late{color:var(--warn)}
.due .lbl{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pbar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .25s linear}
.pbar.sm{height:6px}
.autobar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;border-radius:14px;border:1px dashed var(--line);background:transparent;font-size:14px}
.autobar .dot{width:10px;height:10px;border-radius:50%;background:var(--go);display:inline-block;margin-right:8px;box-shadow:0 0 8px var(--go)}
.ivs{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.ivs b{font-family:var(--font-num);font-size:22px;min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
.autobar .acts2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.autobar.paused .dot{background:var(--warn);box-shadow:none}
.uc .due-row{display:grid;gap:6px}
.uc .due-row .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.uc .due-row .t b{font-family:var(--font-num);font-size:26px;letter-spacing:0;color:var(--accent);font-variant-numeric:tabular-nums}
.uc .due-row .t b.late{color:var(--warn)}
@media (max-width:760px){.next{grid-template-columns:1fr}}

/* Kommande */
.upc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.uc{appearance:none;text-align:left;cursor:pointer;border:2px solid var(--line);background:var(--panel-2);border-radius:16px;padding:14px 16px;display:grid;gap:10px;align-content:start;color:var(--text)}
.uc:hover{border-color:var(--muted)}
.uc.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel-2))}
.uc .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.uc .tm{font-family:var(--font-num);font-weight:700;font-size:38px;line-height:.9;font-variant-numeric:tabular-nums}
.uc .ti{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:22px;line-height:1}
.uc .in{margin-left:auto;font-family:var(--font-num);font-weight:600;font-size:17px;color:var(--accent);font-variant-numeric:tabular-nums}
.uc ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.uc li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px;align-items:baseline;font-size:15px;line-height:1.25}
.uc li b{font-family:var(--font-num);font-size:20px;color:var(--accent);text-align:right}
.uc li small{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.uc .ucacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:4px;border-top:1px solid var(--line)}
.uc .tapme{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hrow.flash{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent)}

/* Pågående start */
.heat-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.heat-h h2{margin:0;font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:26px;line-height:1}
.elapsed{font-family:var(--font-num);font-weight:700;font-size:52px;line-height:.85;color:var(--accent);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.tile{appearance:none;text-align:left;cursor:pointer;border:2px solid var(--line);background:var(--panel-2);border-radius:16px;padding:14px 16px;min-height:150px;display:flex;flex-direction:column;gap:4px;position:relative;transition:transform .08s}
.tile:active{transform:scale(.98)}
.tile .nr{font-family:var(--font-num);font-weight:700;font-size:44px;line-height:.9;color:var(--accent)}
.tile .cls{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .pp{font-weight:600;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .hint{margin-top:auto;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile.fin{border-color:var(--go);background:color-mix(in srgb,var(--go) 12%,var(--panel-2))}
.tile.fin .nr{color:var(--go)}
.tile .res{margin-top:auto;font-family:var(--font-num);font-weight:700;font-size:34px;line-height:1;color:var(--go);font-variant-numeric:tabular-nums}
.tile.dnf{border-color:var(--danger);opacity:.75}
.tile.dnf .res{color:var(--danger)}
.tile.pend{border-color:var(--warn)}
.tile .ask{position:absolute;inset:0;border-radius:14px;background:color-mix(in srgb,var(--ink) 92%,transparent);display:grid;gap:8px;padding:12px;align-content:center}
.tba{color:var(--muted);font-style:italic;font-weight:500}

/* Resultat */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--panel-2);white-space:nowrap}
td.t{font-family:var(--font-num);font-weight:700;font-size:22px;white-space:nowrap}
td.pl{font-family:var(--font-num);font-weight:700;font-size:22px;width:56px}
tr.p1 td.pl{color:#f5c542}tr.p2 td.pl{color:#c3cfe2}tr.p3 td.pl{color:#e0905c}
td input{width:120px;min-height:40px;background:var(--ink);border:1px solid var(--accent);border-radius:8px;padding:6px 8px;font-family:var(--font-num);font-size:20px}

/* Startlista (redigering) */
label.f{display:grid;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px;font-weight:500;color:var(--text);text-transform:none;letter-spacing:0}
textarea{resize:vertical;line-height:1.5;min-height:110px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;align-items:end}
.hrow{display:grid;grid-template-columns:110px minmax(0,1fr) 150px auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.hrow .full{grid-column:1/-1}
.ents{grid-column:1/-1;display:grid;gap:8px}
.ents .eh,.ent{display:grid;grid-template-columns:72px 170px minmax(0,1fr) minmax(0,1fr) 170px 44px;gap:8px;align-items:center}
.ents .eh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.ent input,.ent select{min-height:44px;padding:8px 10px;font-size:16px;width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;color:var(--text)}
.ent .nr{font-family:var(--font-num);font-weight:700;font-size:20px;color:var(--accent);text-align:center}
.ent.has-res input{border-style:dashed}
.ent select{color:var(--muted)}
@media (max-width:900px){.ents .eh{display:none}.ent{grid-template-columns:64px minmax(0,1fr) 44px;padding:10px;border:1px solid var(--line);border-radius:12px}.ent>:nth-child(2){grid-column:2/4}.ent>:nth-child(3),.ent>:nth-child(4),.ent>:nth-child(5){grid-column:1/-1}.ent>:nth-child(6){grid-column:3;grid-row:1}.ent>:nth-child(2){grid-column:2}}
@media (max-width:700px){.hrow{grid-template-columns:1fr 1fr}.hrow>:nth-child(2){grid-column:1/-1;order:-1}}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent)}

/* Nedräkning */
#cd{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;text-align:center;gap:10px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));--cdc:var(--accent);background:radial-gradient(60% 60% at 50% 50%, color-mix(in srgb,var(--cdc) 26%,var(--ink)) 0%, var(--ink) 75%);transition:background .3s}
#cd{overflow:hidden;padding-top:clamp(70px,11vmin,120px)!important;padding-bottom:clamp(120px,17vmin,180px)!important}
#cd::before{content:"";position:absolute;inset:0;background:var(--cdc);opacity:0;pointer-events:none}
/* Lugn puls: en mjuk ljusvåg per sekund, ingen skakning */
#cd.flash::before{animation:cdflash 1s ease-out}
#cd.flash.urgent::before{animation:cdflash 1s ease-out;--fl:.5}
#cd.flash .big{animation:cdslam .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes cdflash{0%{opacity:var(--fl,.32)}100%{opacity:0}}
@keyframes cdslam{0%{transform:scale(1.3);opacity:.5}100%{transform:scale(1);opacity:1}}
#cd .ring{position:absolute;left:50%;top:50%;width:50vmin;height:50vmin;margin:-25vmin 0 0 -25vmin;border-radius:50%;border:1vmin solid var(--cdc);box-shadow:0 0 3vmin var(--cdc);pointer-events:none;animation:cdring 1.1s cubic-bezier(.15,.6,.3,1) forwards}
@keyframes cdring{0%{transform:scale(.4);opacity:.6}100%{transform:scale(2.8);opacity:0}}
#cd.c-blue{--cdc:#3ba7e6}#cd.c-orange{--cdc:#ff8a1f}#cd.c-green{--cdc:var(--go)}
#cd>*:not(.ring):not(.rays):not(.cd-abs){position:relative;z-index:1}
#cd .cd-abs{position:absolute;z-index:2;left:0;right:0}
#cd .cd-top{top:0;display:flex;align-items:center;gap:14px;padding:max(18px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px))}
#cd .cd-top img{height:clamp(34px,6vmin,64px);width:auto}
#cd .cd-top span{font-size:clamp(10px,1.5vmin,14px);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:14px;max-width:16ch;line-height:1.35}
#cd .cd-foot{bottom:0;display:grid;justify-items:center;gap:10px;padding:0 16px max(18px,env(safe-area-inset-bottom,0px))}
#cd .cd-foot .t{font-size:clamp(10px,1.4vmin,13px);font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
#cd .cd-foot .logos{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,1.4vmin,14px)}
#cd .cd-foot .logos span{display:flex;align-items:center;justify-content:center;box-sizing:border-box;height:clamp(40px,7.5vmin,72px);padding:clamp(4px,.8vmin,8px) clamp(8px,1.4vmin,14px);background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#cd .cd-foot .logos img{display:block;height:100%;width:auto;max-width:clamp(80px,16vmin,170px);object-fit:contain}
#cd .cd-foot .logos span.sq{padding:0;overflow:hidden}
#cd .heatlbl{font-family:var(--font-display);font-weight:900;text-transform:uppercase;letter-spacing:.04em;line-height:1;font-size:clamp(40px,10vmin,120px);padding:.12em .55em;border-radius:.25em;color:#fff;background:color-mix(in srgb,var(--cdc) 28%,transparent);border:.06em solid var(--cdc);box-shadow:0 0 6vmin color-mix(in srgb,var(--cdc) 45%,transparent);margin-bottom:1vmin}
/* GOGO! – en explosion utan blink: texten slår in, en ljuskägla av strålar och en tryckvåg, en gång. Färg 2 (--g2) väljs under Inställningar */
#cd.gogo{--g2:#3ba7e6;background:radial-gradient(60% 60% at 50% 50%, color-mix(in srgb,var(--go) 38%,var(--ink)) 0%, color-mix(in srgb,var(--go) 12%,var(--ink)) 85%);animation:gopunch .5s cubic-bezier(.2,1,.3,1)}
@keyframes gopunch{0%{transform:scale(1.04)}100%{transform:none}}
#cd.gogo::before{opacity:1;background:radial-gradient(circle at 50% 50%, color-mix(in srgb,var(--go) 85%,#fff) 0%, color-mix(in srgb,var(--g2) 60%,transparent) 18%, transparent 55%);animation:goburst 1.4s cubic-bezier(.1,.7,.25,1) forwards}
@keyframes goburst{0%{transform:scale(.15);opacity:1}100%{transform:scale(2.6);opacity:0}}
#cd .rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(from 0deg, color-mix(in srgb,var(--go) 55%,transparent) 0deg 4deg, transparent 4deg 15deg);-webkit-mask:radial-gradient(circle, transparent 6%, #000 14%, #000 40%, transparent 62%);mask:radial-gradient(circle, transparent 6%, #000 14%, #000 40%, transparent 62%);animation:gorays 1.8s cubic-bezier(.1,.7,.25,1) forwards}
@keyframes gorays{0%{transform:scale(.2) rotate(0deg);opacity:.9}100%{transform:scale(1.25) rotate(14deg);opacity:0}}
#cd .ring.wave{border-width:2.4vmin;animation:cdwave 1s cubic-bezier(.05,.7,.25,1) forwards}
@keyframes cdwave{0%{transform:scale(.3);opacity:.9}100%{transform:scale(4.2);opacity:0}}
#cd .ring.g2{border-color:var(--g2);box-shadow:0 0 4vmin var(--g2),inset 0 0 4vmin var(--g2)}
#cd .big.go{font-size:min(38vh,30vw);letter-spacing:.01em;color:var(--gt,#fff);-webkit-text-stroke:.5vmin #04140b;text-shadow:0 0 3vmin var(--g2),0 0 10vmin var(--go);animation:goslam .5s cubic-bezier(.15,1.15,.35,1) forwards}
@keyframes goslam{0%{transform:scale(3.4);opacity:0;filter:blur(2.5vmin)}60%{opacity:1;filter:blur(0)}100%{transform:none;opacity:1;filter:none}}
#cd .lbl{font-weight:700;letter-spacing:.3em;text-transform:uppercase;font-size:clamp(16px,3vmin,32px);padding-left:.3em;color:var(--muted)}

#cd .sub{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(16px,2.6vw,28px);color:var(--muted)}

@media (prefers-reduced-motion:reduce){.tile{transition:none}#cd.flash .big,#cd .big.go,#cd .ring,#cd .rays,#cd.gogo{animation:none}#cd.flash::before{animation:none}#cd.gogo::before{animation:none;opacity:.3}}
</style>

<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <img class="plogo" src="assets/pace.png" alt="PACE Performance &amp; Training" width="476" height="212">
        <div style="min-width:0">
          <h1 id="ev-name">HYROX Simulation</h1>
          <p id="ev-sub">Tidtagning</p>
        </div>
      </div>
      <div class="clock" id="clock">00:00:00</div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>

<div id="cd" hidden>
  <div class="cd-abs cd-top"><img src="assets/pace.png" alt="PACE Performance &amp; Training"><span>Official HYROX Training Club</span></div>
  <div class="heatlbl" id="cd-heat">Heat 1</div>
  <div class="lbl" id="cd-lbl">Startar om</div>
  <div class="big" id="cd-num">10</div>
  <div class="sub" id="cd-sub"></div>
  <div class="row" id="cd-ctl" style="justify-content:center;margin-top:16px">
    <button class="btn ghost" type="button" data-act="cd-cancel">Avbryt nedräkning</button>
  </div>
  <div class="cd-abs cd-foot" id="cd-spons"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const KEY = 'pace-hyrox-v1';
const pad = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

/* ---------- Startlista HYROX Simulation 7 nov 2026 ---------- */
const SEED_VERSION = 3;   // startlista 7 nov, omnumrerad 1–51 i startordning (Philip Ahl kommer ej, extra heat 12:45)
const SEED = [
 ['08:30',['1 | Single Herr | Olof Oljelund','2 | Single Herr | Oscar Isaksson','3 | Single Herr | Fredrik Andersson']],
 ['09:00',['4 | Doubles Herr | Michael Nilsson | Martin Kristensson','5 | Doubles Herr | Joakim Petersson | Kristoffer Karlsson','6 | Doubles Herr PRO | Max Quiroga | Marcus Kärrstrand','7 | Doubles Herr PRO | Salim Abdulahad | Joakim Nyman']],
 ['09:30',['8 | Doubles Herr | Viktor Tuvenäs | Anton Johansson','9 | Doubles Herr | Johann Kaiser | Björn Karlsson','10 | Doubles Herr | Ola Nilsson | Anton Kristensson','11 | Doubles Herr | Goran Edenro | Krister Syrten']],
 ['10:00',['12 | Single Dam | Emma Larsson','13 | Single Dam | Jessica Andersson','14 | Single Dam | Anne Edenro','15 | Doubles Dam | Malin Kaiser | Charlotte Karlsson']],
 ['10:30',['16 | Doubles Dam | Josefine Rosander | Amanda Svensson','17 | Doubles Dam | Caroline Öhagen | Maja Werlid','18 | Doubles Dam | Linn Hultfeldt | Jennie Javette','19 | Doubles Dam | Linnéa Andersson | Alice Klinteby']],
 ['11:00',['20 | Doubles Dam | Sandra Skattberg | Kajsa Karlsson','21 | Doubles Dam | Ebba Berndtsson | Amanda Nagy','22 | Doubles Dam | Line Nygård | Ida Möller','23 | Doubles Dam | Susanne Hedberg | Anneli Olsson']],
 ['11:30',['24 | Doubles Dam | Josefin Nygren | Anna Lindqvist','25 | Doubles Dam | Nadia Andersson | Linn Sidahl','26 | Doubles Mixed | Erik Kovacs | Emma Kovacs','27 | Doubles Dam | Caroline Kassell | Kristina Altner']],
 ['12:00',['28 | Doubles Dam | Ella Daneshmand | Evelina Montgomery','29 | Doubles Dam | Lina Andersson | Josefine Eklund','30 | Doubles Dam | Helen Lindén | Thea Grangéus','31 | Doubles Dam | Ellen Rundbäck | Stina Rehnqvist']],
 ['12:30',['32 | Doubles Dam | Emma Rignell | Amanda Hansson','33 | Doubles Dam | Johanna Lindberg | Åsa Cederlöf','34 | Doubles Mixed | Linda Thernell | Jonas Öjvik','35 | Single Dam | Lina Oliw']],
 ['12:45',['36 | Doubles Mixed | Marlene Nilsson | Thomas Erixon']],
 ['13:00',['37 | Single Herr | Kristian Gustavasson','38 | Doubles Mixed | Mattias Olsson | Anna-Maria Olsson','39 | Doubles Mixed | Robin Demén | Emilia Demén','40 | Doubles Herr | Mattias Helde | Mathias Hilding Borg']],
 ['13:30',['41 | Doubles Mixed | Jacob Medes | Charlotte Holmquist','42 | Doubles Mixed | Ida axelsson | Magnus Axelsson','43 | Doubles Mixed | Patricia Ynner | Robin Johansson','44 | Doubles Mixed | Sandra Lundahl | Sebastian Josefsson']],
 ['14:00',['45 | Doubles Mixed | Sofia Torstensson | Nicholas Johansson','46 | Doubles Mixed | Hampus von Platen | Jenny von Platen','47 | Doubles Mixed | William Wallsin | Rebecka Mikkonen','48 | Doubles Mixed | Anh Tran | Nina Wedel']],
 ['14:30',['49 | Doubles Mixed | Christer Sandberg | Nora Sandberg','50 | Doubles Mixed | Andreas Söderström | Gisela Söderström','51 | Single Herr | Anders Lövdahl']],
];
const seed = () => ({
  v: 1, seedVersion: SEED_VERSION,
  event: { name:'HYROX Simulation', date:'2026-11-07', interval:30, countdown:10, sound:true, goColor:'blue', sponsors:true, auto:true, autoPaused:false },
  heats: SEED.map(([time, rows], i) => ({ id:uid(), title:`Heat ${i+1}`, time, lanes:rows.join('\n'), startedAt:null })),
  res: {},   // nyckel: startnummer -> { fin: tidsstämpel ms, dnf: bool }
});

let state;
function load() {
  try { const r = localStorage.getItem(KEY); if (r) state = JSON.parse(r); } catch (e) {}
  if (!state || !state.heats) state = seed();
  state.event = Object.assign(seed().event, state.event);
  state.res = state.res || {};
  for (const h of state.heats) h.title = String(h.title || '').replace(/^Start (\d+)$/, 'Heat $1');   // gamla namn
  if (state.seedVersion !== SEED_VERSION) {   // ny startlista: ersätt heat och testtider, behåll inställningar
    const ev = state.event; state = seed(); state.event = ev; state.event.autoSkip = null; state.event.autoPaused = false; state.event.interval = 30;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    ui.newList = true;
  }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('Kunde inte spara – kontrollera att privat surfning är av'); } }

/* ---------- Hjälpfunktioner ---------- */
function parseEntry(line, i) {
  const p = line.split('|').map(t => t.trim());
  if (p.length >= 3) return { nr:p[0] || String(i+1), cls:p[1], people:p.slice(2).filter(Boolean) };
  return { nr:String(i+1), cls:'', people:[line.trim()] };
}
const entriesOf = h => (h.lanes || '').split('\n').filter(t => t.trim()).map(parseEntry);
const isTBA = n => /^x{2,}$/i.test(n);
const peopleHtml = e => e.people.map(n => isTBA(n) ? '<div class="pp tba">Partner TBA</div>' : `<div class="pp">${esc(n)}</div>`).join('');
const names = e => e.people.map(n => isTBA(n) ? 'Partner TBA' : n).join(' & ');
function fmtTime(ms) {
  if (ms == null || ms < 0) ms = 0;
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`;
}
const fmtClock = (t, sec) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}${sec ? ':' + pad(d.getSeconds()) : ''}`; };
function fmtDur(ms) { const m = Math.round(ms / 60000), h = Math.floor(m / 60); return h ? `${h} h${m % 60 ? ' ' + m % 60 + ' min' : ''}` : `${m} min`; }
const toMin = s => { const m = /^(\d{1,2})[:.](\d{2})/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; };
function parseDur(s) {  // "1:05:23" eller "65:23" -> ms
  const p = String(s).trim().split(/[:.]/).map(Number);
  if (!p.length || p.some(isNaN) || p.length > 3) return null;
  return p.reduce((a, x) => a * 60 + x, 0) * 1000;
}
function heatStatus(h) {
  if (!h.startedAt) return 'wait';
  const es = entriesOf(h);
  return es.length && es.every(e => state.res[e.nr]?.fin || state.res[e.nr]?.dnf) ? 'done' : 'run';
}
// Automatiska starter: varje start rullar igång X min efter att föregående start gick (kedja)
function dueMap() {
  const m = new Map(); if (!state.event.auto) return m;
  // Följer startlistans tider: avståndet mellan heaten (30 min, 15 min …) räknas från föregående faktiska start
  const iv = +state.event.interval || 30;
  let last = null, lastPlan = null;
  for (const h of state.heats) {
    const pm = toMin(h.time);
    if (h.startedAt) { last = h.startedAt; lastPlan = pm; continue; }
    if (last == null) continue;
    const gap = pm != null && lastPlan != null && pm > lastPlan ? pm - lastPlan : iv;
    const due = last + gap * 60000; m.set(h.id, { due, from: last }); last = due; lastPlan = pm != null ? pm : (lastPlan != null ? lastPlan + gap : null);
  }
  return m;
}
const plannedSpan = () => {
  const ms = state.heats.map(h => toMin(h.time)).filter(x => x != null);
  if (!ms.length) return null;
  const a = Math.min(...ms), b = Math.max(...ms) + (+state.event.interval || 30);
  return { a, b, ms:(b - a) * 60000 };
};
const ivStepper = () => { const nx = state.heats.find(h => !h.startedAt); return `<span class="ivs" role="group" aria-label="Flytta kommande heat">
  <button class="btn sm" type="button" data-act="iv" data-d="-5" aria-label="5 minuter tidigare">−5</button><button class="btn sm" type="button" data-act="iv" data-d="-1" aria-label="1 minut tidigare">−1</button>
  <b>${nx ? esc(nx.time) : '–'}</b>
  <button class="btn sm" type="button" data-act="iv" data-d="1" aria-label="1 minut senare">+1</button><button class="btn sm" type="button" data-act="iv" data-d="5" aria-label="5 minuter senare">+5</button></span>`; };
const minTxt = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;

/* ---------- Ljud ---------- */
let audio;
let master;
function ac() {   // gemensam ljudkedja med kompressor så att det blir kraftfullt utan att spräcka
  if (!state.event.sound) return null;
  try {
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      const comp = audio.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .25;
      master = audio.createGain(); master.gain.value = .9;
      master.connect(comp); comp.connect(audio.destination);
    }
    audio.resume?.();
    return audio;
  } catch (e) { return null; }
}
function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function kick(t, vol = 1) {   // trumslag: tonhöjd som faller
  const a = audio, o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .28);
  env(g, t, .004, vol, .5); o.connect(g); g.connect(master); o.start(t); o.stop(t + .6);
}
function noise(t, dur, vol, hp = 2500) {   // cymbal/brus
  const a = audio, n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'highpass'; f.frequency.value = hp;
  env(g, t, .005, vol, dur); src.connect(f); f.connect(g); g.connect(master); src.start(t);
}
function brass(t, freqs, dur, vol = .16, sweep = 2600) {   // mässingsackord: dubbla sågtandsvågor + filter som öppnar sig
  const a = audio, f = a.createBiquadFilter(), g = a.createGain();
  f.type = 'lowpass'; f.Q.value = 2; f.frequency.setValueAtTime(350, t); f.frequency.exponentialRampToValueAtTime(sweep, t + .09); f.frequency.exponentialRampToValueAtTime(sweep * .55, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .025);
  g.gain.setValueAtTime(vol, t + Math.max(.03, dur - .25)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  f.connect(g); g.connect(master);
  for (const fr of freqs) for (const det of [-7, 7]) {
    const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.detune.value = det;
    o.connect(f); o.start(t); o.stop(t + dur + .05);
  }
}
function tickSound(s) {   // ett trumslag per sekund, de sista tre med mässingsstöt
  if (!ac()) return;
  const t = audio.currentTime + .01;
  if (s > 3) { kick(t, s > 5 ? .45 : .6); return; }
  kick(t, .95);
  brass(t, [196, 293.7, 392], .32, .13, 2200);   // G-kvint, samma ton 3-2-1
}
function beep(f, d) {   // kort pip vid målgång
  if (!ac()) return;
  try {
    const t = audio.currentTime + .005, o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle'; o.frequency.value = f; env(g, t, .005, .25, d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
  } catch (e) {}
}

/* ---------- UI ---------- */
const ui = { tab:'tid', cls:'', pending:null, pendT:null, editing:null, cd:null, upSel:null };
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

function renderTabs() {
  const running = state.heats.filter(h => heatStatus(h) === 'run').length;
  const T = [['tid', 'Tidtagning', running], ['res', 'Resultat'], ['lista', 'Startlista'], ['inst', 'Inställningar']];
  $('#tabs').innerHTML = T.map(([k, l, n]) => `<button class="tab" role="tab" type="button" aria-selected="${ui.tab === k}" data-act="tab" data-tab="${k}">${l}${n ? `<span class="cnt">${n}</span>` : ''}</button>`).join('');
}
function render() {
  $('#ev-name').textContent = state.event.name || 'HYROX Simulation';
  const d = state.event.date ? new Date(state.event.date + 'T12:00').toLocaleDateString('sv-SE', { weekday:'long', day:'numeric', month:'long' }) : '';
  const sp = plannedSpan();
  $('#ev-sub').textContent = [d, sp && `Aktivt ${minTxt(sp.a)}–${minTxt(sp.b)} · ${fmtDur(sp.ms)}`].filter(Boolean).join(' · ');
  renderTabs();
  $('#main').innerHTML = V[ui.tab]();
  tick();
}

const V = {
  tid() {
    const waiting = state.heats.filter(h => !h.startedAt);
    const running = state.heats.filter(h => heatStatus(h) === 'run').sort((a, b) => a.startedAt - b.startedAt);
    const done = state.heats.filter(h => heatStatus(h) === 'done');
    const nx = waiting[0], dm = dueMap();
    let html = '', autoHtml = '';
    if (state.event.auto && waiting.length) {
      const p = state.event.autoPaused, begun = state.heats.some(h => h.startedAt);
      autoHtml = `<div class="autobar ${p ? 'paused' : ''}"><div><span class="dot"></span><b>Automatiska starter ${p ? 'pausade' : 'PÅ'}</b> <span class="muted">· följer startlistans tider${begun ? ', räknat från föregående faktiska start' : ' när första heatet har gått'}. Flytta kommande heat:</span></div>
        <div class="acts2">${ivStepper()}${begun ? `<button class="btn sm" type="button" data-act="auto-pause">${p ? '▶ Fortsätt automatik' : '❚❚ Pausa automatik'}</button>` : ''}</div></div>`;
    }
    if (state.heats.some(h => h.startedAt && !sameDay(h.startedAt, Date.now()))) {
      html += `<div class="autobar paused" style="border-style:solid;border-color:var(--warn)"><div><span class="dot"></span><b>Tider från en annan dag ligger kvar</b> <span class="muted">· troligen från ett test. Starta om allt innan eventet börjar.</span></div>
        <button class="btn sm danger" type="button" data-act="ask-reset-all">↺ Starta om allt</button></div>`;
    }
    if (nx) {
      const es = entriesOf(nx);
      html += `<section class="sec"><div class="next">
        <div style="min-width:0">
          ${dm.get(nx.id) ? `<div class="eyebrow">Nästa start · ${state.event.autoPaused ? 'automatik pausad' : `startar automatiskt kl ${fmtClock(dm.get(nx.id).due, true)}`}</div>
          <div class="row" style="align-items:baseline;gap:16px;margin-top:6px"><h3>${esc(nx.title)}</h3><span class="muted">planerad ${esc(nx.time)}</span></div>
          <div class="due"><div class="big js-due" data-due="${dm.get(nx.id).due}">–</div><div class="pbar"><i class="js-pbar" data-due="${dm.get(nx.id).due}" data-from="${dm.get(nx.id).from}"></i></div></div>`
          : `<div class="eyebrow">Nästa start · planerad</div>
          <div class="row" style="align-items:baseline;gap:16px;margin-top:6px"><div class="tm">${esc(nx.time)}</div><h3>${esc(nx.title)}</h3><span class="muted js-until" data-min="${toMin(nx.time) ?? ''}"></span></div>`}
          <div class="who">${es.map(e => `<span><b>${esc(e.nr)}</b>${esc(names(e))}</span>`).join('')}</div>
        </div>
        <div class="acts">
          <button class="btn primary big" type="button" data-act="cd-start" data-id="${nx.id}">Nedräkning ${+state.event.countdown || 10} s</button>
          <button class="btn go" type="button" data-act="start-now" data-id="${nx.id}">Starta direkt</button>
        </div>
      </div></section>`;
    } else if (!running.length) {
      html += `<section class="sec"><div class="empty">Alla starter är klara. Resultaten finns under <b>Resultat</b>.</div></section>`;
    }
    for (const h of running) {
      const es = entriesOf(h), fin = es.filter(e => state.res[e.nr]?.fin || state.res[e.nr]?.dnf).length;
      html += `<section class="sec">
        <div class="heat-h">
          <div><div class="eyebrow">Pågår · startade ${fmtClock(h.startedAt, true)} · ${fin}/${es.length} i mål</div><h2>${esc(h.title)} <span class="muted" style="font-size:.7em">${esc(h.time)}</span></h2></div>
          <div class="elapsed js-el" data-from="${h.startedAt}">0:00</div>
        </div>
        <div class="tiles">${es.map(e => tile(h, e)).join('')}</div>
        <div class="row" style="justify-content:flex-end"><button class="btn danger sm" type="button" data-act="ask-reset" data-id="${h.id}">↺ Starta om ${esc(h.title)} (felstart/test)</button></div>
      </section>`;
    }
    if (waiting.length > 1) {
      const rest = waiting.slice(1), people = rest.reduce((n, h) => n + entriesOf(h).length, 0);
      html += `<section class="sec" id="kommande"><div class="sec-h"><div><h2>Kommande starter</h2><p>${rest.length} starter · ${people} startnummer kvar. Tryck på en start för att starta den, flytta fram den eller redigera.</p></div></div>
        <div class="upc">${rest.map((h, k) => upcoming(h, k, dm)).join('')}</div></section>`;
    }
    if (done.length) {
      html += `<section class="sec"><div class="sec-h"><div><h2>Klara starter</h2></div></div>
        <div class="row">${done.map(h => `<span class="pill done">${esc(h.title)} ✓</span><button class="btn sm ghost" type="button" data-act="ask-reset" data-id="${h.id}">↺ Starta om</button>`).join('')}</div></section>`;
    }
    html += autoHtml;   // automatikens status ligger längst ner, den är sällan det man behöver
    if (state.heats.some(h => h.startedAt)) {
      html += `<section class="sec"><div class="sec-h"><div><h2>Starta om</h2><p>Har ni testat? Nollställ alla starter och tider så att allt är som innan Start 1. Startlistan och namnen ligger kvar.</p></div>
        <button class="btn danger" type="button" data-act="ask-reset-all">↺ Starta om allt</button></div></section>`;
    }
    return html;
  },

  res() {
    const rows = allResults();
    const classes = [...new Set(rows.map(r => r.e.cls).filter(Boolean))];
    if (ui.cls && !classes.includes(ui.cls)) ui.cls = '';
    const list = ui.cls ? rows.filter(r => r.e.cls === ui.cls) : rows;
    const finished = rows.filter(r => r.ms != null).length;
    return `<section class="sec">
      <div class="sec-h"><div><h2>Resultat</h2><p>${finished} av ${rows.length} i mål. Placering räknas inom klassen. Tryck på ✎ för att rätta en tid.</p></div>
        <button class="btn sm" type="button" data-act="csv">Exportera CSV</button></div>
      <div class="chips"><button class="tab" type="button" aria-selected="${!ui.cls}" data-act="cls" data-cls="">Alla</button>${classes.map(c => `<button class="tab" type="button" aria-selected="${ui.cls === c}" data-act="cls" data-cls="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <div class="tblwrap"><table>
        <thead><tr><th>Plac</th><th>Nr</th><th>Deltagare</th><th>Klass</th><th>Start</th><th>Tid</th><th></th></tr></thead>
        <tbody>${list.map(r => `<tr class="${r.place ? 'p' + r.place : ''}">
          <td class="pl">${r.place ?? ''}</td>
          <td class="num" style="font-weight:700;font-size:18px">${esc(r.e.nr)}</td>
          <td>${esc(names(r.e))}</td>
          <td class="muted">${esc(r.e.cls)}</td>
          <td class="muted num">${esc(r.h.title)}</td>
          <td class="t">${ui.editing === r.e.nr

function tile(h, e) {
  const r = state.res[e.nr] || {};
  const pend = ui.pending === e.nr;
  const cls = r.dnf ? 'dnf' : r.fin ? 'fin' : '';
  const body = `<div class="nr">${esc(e.nr)}</div><div class="cls">${esc(e.cls)}</div>${peopleHtml(e)}`
    + (r.dnf ? '<div class="res">DNF</div>' : r.fin ? `<div class="res">${fmtTime(r.fin - h.startedAt)}</div>` : '<div class="hint">Tryck vid målgång</div>');
  const ask = pend ? `<div class="ask">
      ${r.fin || r.dnf ? `<button class="btn danger sm" type="button" data-act="undo" data-nr="${esc(e.nr)}">Ångra ${r.dnf ? 'DNF' : 'målgång'}</button>`
                       : `<button class="btn danger sm" type="button" data-act="dnf" data-nr="${esc(e.nr)}">Bröt loppet (DNF)</button>`}
      <button class="btn sm" type="button" data-act="unpend">Behåll</button></div>` : '';
  return `<div class="tile ${cls} ${pend ? 'pend' : ''}" role="button" tabindex="0" data-act="tap" data-nr="${esc(e.nr)}" data-heat="${h.id}">${body}${ask}</div>`;
}

function allResults() {
  const rows = [];
  for (const h of state.heats) for (const e of entriesOf(h)) {
    const r = state.res[e.nr] || {};
    rows.push({ h, e, dnf:!!r.dnf, ms: (!r.dnf && r.fin && h.startedAt) ? r.fin - h.startedAt : null });
  }
  // placering inom klass
  const byCls = {};
  for (const r of rows) if (r.ms != null) (byCls[r.e.cls] = byCls[r.e.cls] || []).push(r);
  for (const list of Object.values(byCls)) list.sort((a, b) => a.ms - b.ms).forEach((r, i) => r.place = i + 1);
  const rank = r => r.ms != null ? 0 : r.h.startedAt && !r.dnf ? 1 : r.dnf ? 3 : 2;
  return rows.sort((a, b) => rank(a) - rank(b) || (a.ms ?? 0) - (b.ms ?? 0) || (+a.e.nr - +b.e.nr));
}

/* ---------- Start & nedräkning ---------- */
function startHeat(id, at) {
  const h = state.heats.find(x => x.id === id); if (!h || h.startedAt) return;
  h.startedAt = at || Date.now(); ui.upSel = null; save();
  toast(`${h.title} startad ${fmtClock(h.startedAt, true)}`);
  ui.tab = 'tid'; render();
}
function beginCountdown(id, preview, target) {
  const h = preview ? { title:'Test – ingen start' } : state.heats.find(x => x.id === id); if (!h) return;
  ac();
  ui.cd = { id, target: target || Date.now() + (+state.event.countdown || 10) * 1000, last:null, goUntil:null, auto: !!target };
  $('#cd-heat').textContent = preview ? 'Test' : h.title; $('#cd-sub').textContent = preview ? 'Ingen start registreras' : '';
  renderSponsors();
  if (preview) ui.cd.preview = true;
  $('#cd-ctl').hidden = false; $('#cd').classList.remove('gogo'); $('#cd').querySelectorAll('.ring,.rays').forEach(r => r.remove()); $('#cd').classList.remove('hit'); $('#cd').hidden = false; tick();
}
function cdColor(c, urgent) {   // byt färg, blixt + chockvåg varje sekund
  const el = $('#cd');
  el.classList.remove('c-blue', 'c-orange', 'c-green', 'flash', 'urgent', 'gogo');
  void el.offsetWidth;   // starta om animationen
  el.classList.add('c-' + c, 'flash');
  if (urgent) el.classList.add('urgent');
  ring(0);
}
function ring(delay, cls) {
  setTimeout(() => {
    const r = document.createElement('div'); r.className = 'ring' + (cls ? ' ' + cls : '');
    r.addEventListener('animationend', () => r.remove());
    $('#cd').appendChild(r);
  }, delay);
}
const SPONSORS = [

  const el = $('#cd');
  el.classList.remove('flash', 'urgent', 'c-blue', 'c-orange', 'gogo');

function cdTick() {
  const c = ui.cd; if (!c) return;
  const now = Date.now(), num = $('#cd-num');
  if (c.goUntil) { if (now > c.goUntil) { ui.cd = null; $('#cd').hidden = true; if (!c.preview) render(); } return; }
  const ms = c.target - now;
  if (ms > 0) {
    const s = Math.ceil(ms / 1000);
    $('#cd-lbl').textContent = 'Startar om';
    if (num.textContent !== String(s)) {
      num.textContent = s; num.className = 'big';
      cdColor(s > 5 ? 'blue' : s > 1 ? 'orange' : 'green', s <= 3);   // 10–6 blå, 5–2 orange, 1–0 grön
      if (c.last !== s) { c.last = s; tickSound(s); }
    }
  } else {
    if (!c.preview) startHeat(c.id, c.target);           // exakt tidpunkt när nedräkningen nådde 0
    $('#cd-lbl').textContent = ''; num.textContent = 'GOGO!'; num.className = 'big go'; $('#cd-ctl').hidden = true;
    gogo(); c.goUntil = now + 3200;
  }
}

/* ---------- Tick ---------- */
function tick() {
  const now = Date.now();
  $('#clock').textContent = fmtClock(now, true);
  document.querySelectorAll('.js-el').forEach(e => e.textContent = fmtTime(now - +e.dataset.from));
  document.querySelectorAll('.js-until').forEach(e => {
    const m = +e.dataset.min; if (!e.dataset.min) return;
    const d = new Date(state.event.date + 'T00:00'); d.setHours(0, m, 0, 0);
    const diff = d - now;
    e.textContent = diff > 0 && diff < 6 * 3600000 ? `om ${fmtTime(diff)}` : diff <= 0 && diff > -3600000 ? `${fmtTime(-diff)} sen` : '';
  });
  document.querySelectorAll('.js-due').forEach(e => {
    const d = +e.dataset.due - now;
    e.textContent = d > 0 ? fmtTime(d) : `Väntar på start · ${fmtTime(-d)}`;
    e.classList.toggle('late', d <= 0);
  });
  document.querySelectorAll('.js-pbar').forEach(e => {
    const a = +e.dataset.from, b = +e.dataset.due;
    e.style.width = Math.max(0, Math.min(100, (now - a) / (b - a) * 100)).toFixed(1) + '%';
  });
  autoTick(now);
  cdTick();
}
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();   // gamla tester från en annan dag startas inte i efterhand
function autoTick(now) {   // automatiska starter enligt schemat – fungerar även om appen legat i bakgrunden
  if (!state.event.auto || state.event.autoPaused || ui.cd) return;
  const cdMs = (+state.event.countdown || 10) * 1000, caught = [];
  for (let guard = 0; guard < 50; guard++) {
    const h = state.heats.find(x => !x.startedAt); if (!h) break;
    const d = dueMap().get(h.id); if (!d) break;
    if (state.event.autoSkip === h.id + ':' + d.due) break;   // nedräkningen avbröts – vänta på manuell start
    if (now >= d.due) {
      // starttiden har passerat medan appen inte var aktiv: registrera starten på exakt rätt klockslag
      if (!sameDay(d.due, now)) break;
      h.startedAt = d.due; caught.push(h); continue;
    }
    if (now >= d.due - cdMs && d.due - now > 400) beginCountdown(h.id, false, d.due);
    break;
  }
  if (caught.length) {
    save(); render();
    toast(caught.map(h => `${h.title} startade automatiskt ${fmtClock(h.startedAt, true)}`).join(' · '));
  }
}
setInterval(tick, 200);

/* ---------- Händelser ---------- */
function setPath(p, v) { const k = p.split('.'); let o = state; for (let i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length - 1]] = v; }
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.ent && el.tagName === 'INPUT') {
    const [i, k, f] = el.dataset.ent.split(':'), h = state.heats[+i], es = entriesOf(h), en = es[+k];
    if (!en) return;
    if (f === 'nr') return;   // startnummer sparas när fältet lämnas (flyttar ev. tid)
    if (f === 'cls') en.cls = el.value.replace(/\|/g, '');
    else { const ix = f === 'p1' ? 0 : 1; en.people[ix] = el.value.replace(/\|/g, ''); en.people = [en.people[0] || '', en.people[1] || ''].filter((x, j) => j === 0 || x); }
    h.lanes = serialize(es); save();
    return;
  }
  if (el.dataset.path) {
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'number') v = el.value === '' ? '' : Number(el.value);
    setPath(el.dataset.path, v); save();
    if (el.dataset.path.startsWith('event.')) { $('#ev-name').textContent = state.event.name; }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.ent && el.dataset.ent.endsWith(':nr')) {
    const [i, k] = el.dataset.ent.split(':'), h = state.heats[+i], es = entriesOf(h), en = es[+k];
    const nv = el.value.trim().replace(/\|/g, ''), old = en.nr;
    if (!nv || nv === old) { el.value = old; return; }
    if (allNrs().includes(nv)) { toast(`Nr ${nv} finns redan`); el.value = old; return; }
    if (state.res[old]) { state.res[nv] = state.res[old]; delete state.res[old]; }
    en.nr = nv; h.lanes = serialize(es); save(); render(); toast(`Nr ${old} ändrat till ${nv}`); return;
  }
  if (el.dataset.move) {
    const [i, k] = el.dataset.move.split(':'), from = state.heats[+i], to = state.heats.find(x => x.id === el.value);
    if (!to) return;
    const es = entriesOf(from), en = es[+k];
    if (state.res[en.nr]?.fin || state.res[en.nr]?.dnf) { toast(`Nr ${en.nr} har redan en tid. Ångra målgången först.`); el.value = ''; return; }
    es.splice(+k, 1); from.lanes = serialize(es);
    const tes = entriesOf(to); tes.push(en); to.lanes = serialize(tes);
    save(); render(); toast(`Nr ${en.nr} flyttad till ${to.title} (${to.time})${to.startedAt ? '. Obs! den starten har redan gått.' : ''}`);
    document.getElementById('heat-' + to.id)?.classList.add('flash'); setTimeout(() => document.getElementById('heat-' + to.id)?.classList.remove('flash'), 2000);
    return;
  }
  if (el.dataset.start != null) {
    const h = state.heats[+el.dataset.start];
    if (!el.value) { if (h.startedAt) { toast('Använd Felstart för att nollställa en start'); el.value = fmtClock(h.startedAt, true); } return; }
    const [H, M, S] = el.value.split(':').map(Number);
    const base = h.startedAt ? new Date(h.startedAt) : new Date();
    base.setHours(H, M, S || 0, 0);
    h.startedAt = base.getTime(); save(); toast(`Starttid för ${h.title}: ${fmtClock(h.startedAt, true)}`); render();
  }
  if (el.dataset.path === 'event.date' || el.dataset.path === 'event.interval' || (el.dataset.path || '').endsWith('.time')) render();
  if (el.id === 'f-import' && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { try { const d = JSON.parse(fr.result); if (!d.heats) throw 0; state = d; load2(); save(); render(); toast('Backup inläst'); } catch (x) { toast('Filen gick inte att läsa. Välj en backup från den här appen.'); } };
    fr.readAsText(el.files[0]);
  }
});
function load2() { state.event = Object.assign(seed().event, state.event); state.res = state.res || {}; }
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'f-edit') saveEdit(e.target.dataset.nr);
  if ((e.key === 'Enter' || e.key === ' ') && (e.target.classList?.contains('tile') || e.target.classList?.contains('uc'))) { e.preventDefault(); e.target.click(); }
});
function saveEdit(nr) {
  const inp = $('#f-edit'); const r = allResults().find(x => x.e.nr === nr);
  if (!inp || !r) return;
  const v = inp.value.trim().toUpperCase();
  if (!v) delete state.res[nr];
  else if (v === 'DNF') state.res[nr] = { dnf:true };
  else { const ms = parseDur(v); if (ms == null) { toast('Skriv tiden som h:mm:ss, t.ex. 1:05:23'); return; } state.res[nr] = { fin: r.h.startedAt + ms }; }
  ui.editing = null; save(); render(); toast(`Tid för nr ${nr} sparad`);
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function setPending(nr) {
  ui.pending = nr; clearTimeout(ui.pendT);
  if (nr) ui.pendT = setTimeout(() => { ui.pending = null; if (ui.tab === 'tid') render(); }, 5000);
  render();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'tab') { ui.tab = b.dataset.tab; ui.editing = null; render(); scrollTo(0, 0); }
  else if (a === 'tap') {
    const nr = b.dataset.nr, r = state.res[nr];
    if (ui.pending === nr) return;
    if (r && (r.fin || r.dnf)) { setPending(nr); return; }
    state.res[nr] = { fin: Date.now() }; save(); beep(880, .08);
    const h = state.heats.find(x => x.id === b.dataset.heat);
    toast(`Nr ${nr} i mål: ${fmtTime(state.res[nr].fin - h.startedAt)}`);
    setPending(null);
  }
  else if (a === 'undo') { delete state.res[b.dataset.nr]; save(); toast(`Nr ${b.dataset.nr} återställd`); setPending(null); }
  else if (a === 'dnf') { state.res[b.dataset.nr] = { dnf:true }; save(); setPending(null); }
  else if (a === 'unpend') setPending(null);
  else if (a === 'up-sel') { ui.upSel = ui.upSel === b.dataset.id ? null : b.dataset.id; render(); }
  else if (a === 'up-move') {
    // byt plats (och planerad tid) med starten före bland de som inte har startat
    const waiting = state.heats.filter(h => !h.startedAt);
    const i = waiting.findIndex(h => h.id === b.dataset.id); if (i < 1) return;
    const A = waiting[i - 1], B = waiting[i], ia = state.heats.indexOf(A), ib = state.heats.indexOf(B);
    [A.time, B.time] = [B.time, A.time];
    state.heats[ia] = B; state.heats[ib] = A;
    save(); render(); toast(`${B.title} flyttad till ${B.time}${i === 1 ? ' och är nu nästa start' : ''}`);
  }
  else if (a === 'up-edit') {
    ui.tab = 'lista'; ui.upSel = null; render();
    const el = document.getElementById('heat-' + b.dataset.id);
    if (el) { el.scrollIntoView({ block:'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2500); }
  }
  else if (a === 'cd-test') beginCountdown(null, true);
  else if (a === 'iv') {
    // flytta alla kommande heat lika mycket – avstånden mellan dem behålls
    const d = +b.dataset.d, up = state.heats.filter(h => !h.startedAt && toMin(h.time) != null);
    if (!up.length) return;
    up.forEach(h => h.time = minTxt(Math.max(0, toMin(h.time) + d)));
    state.event.autoSkip = null; save(); const y = scrollY; render(); scrollTo(0, y);
    toast(`Kommande heat flyttade ${d > 0 ? '+' : ''}${d} min · nästa ${up[0].title} kl ${up[0].time}`);
  }
  else if (a === 'auto-pause') { state.event.autoPaused = !state.event.autoPaused; save(); render(); toast(state.event.autoPaused ? 'Automatiken pausad. Starta nästa manuellt.' : 'Automatiken är på igen'); }
  else if (a === 'go-test') {   // visa GOGO! utan att starta något
    ac();
    $('#cd-lbl').textContent = ''; $('#cd-heat').textContent = 'Test'; $('#cd-sub').textContent = 'Ingen start registreras'; $('#cd-ctl').hidden = true; renderSponsors();
    const n = $('#cd-num'); n.textContent = 'GOGO!'; n.className = 'big'; void n.offsetWidth; n.className = 'big go';
    $('#cd').querySelectorAll('.ring,.rays').forEach(r => r.remove()); $('#cd').classList.remove('hit'); $('#cd').hidden = false;
    gogo(); ui.cd = { preview:true, goUntil: Date.now() + 3200 };
  }
  else if (a === 'add-ent') {
    const h = state.heats[+b.dataset.i], es = entriesOf(h);
    const nums = allNrs().map(Number).filter(n => !isNaN(n)), nr = String((nums.length ? Math.max(...nums) : 0) + 1);
    es.push({ nr, cls: es[es.length - 1]?.cls || '', people:[''] }); h.lanes = serialize(es); save(); render();
    document.getElementById(`f-e-${h.id}-${es.length - 1}-p1`)?.focus();
  }
  else if (a === 'ask-del-ent') {
    const [i, k] = b.dataset.ent.split(':'), en = entriesOf(state.heats[+i])[+k];
    b.outerHTML = `<span class="row" style="grid-column:1/-1"><span>Ta bort nr ${esc(en.nr)}?</span><button class="btn danger sm" type="button" data-act="del-ent" data-ent="${b.dataset.ent}">Ja, ta bort</button><button class="btn sm" type="button" data-act="rerender">Avbryt</button></span>`;
  }
  else if (a === 'del-ent') {
    const [i, k] = b.dataset.ent.split(':'), h = state.heats[+i], es = entriesOf(h), en = es.splice(+k, 1)[0];
    delete state.res[en.nr]; h.lanes = serialize(es); save(); render(); toast(`Nr ${en.nr} borttagen`);
  }
  else if (a === 'cd-start') beginCountdown(b.dataset.id);
  else if (a === 'cd-cancel') { if (ui.cd?.auto) { state.event.autoSkip = ui.cd.id + ':' + ui.cd.target; save(); } ui.cd = null; $('#cd').hidden = true; render(); }
  else if (a === 'start-now') startHeat(b.dataset.id);
  else if (a === 'ask-reset') {
    const h = state.heats.find(x => x.id === b.dataset.id);
    b.outerHTML = `<span class="row"><span>Starta om ${esc(h.title)}? Starttiden och alla tider i den raderas.</span><button class="btn danger sm" type="button" data-act="reset" data-id="${h.id}">Ja, starta om</button><button class="btn sm" type="button" data-act="rerender">Avbryt</button></span>`;
  }
  else if (a === 'ask-reset-all') {
    b.outerHTML = `<span class="row"><span>Starta om allt? Alla starter och tider raderas.</span><button class="btn danger" type="button" data-act="clear-times">Ja, starta om allt</button><button class="btn" type="button" data-act="rerender">Avbryt</button></span>`;
  }
  else if (a === 'rerender') render();
  else if (a === 'reset') {
    const h = state.heats.find(x => x.id === b.dataset.id);
    h.startedAt = null; for (const en of entriesOf(h)) delete state.res[en.nr];
    ui.pending = null; save(); render(); toast(`${h.title} är nollställd och redo att startas igen`);
  }
  else if (a === 'cls') { ui.cls = b.dataset.cls; render(); }
  else if (a === 'edit') { ui.editing = b.dataset.nr; render(); const i = $('#f-edit'); i?.focus(); i?.select(); }
  else if (a === 'edit-save') saveEdit(b.dataset.nr);
  else if (a === 'gen') {
    const f = toMin($('#f-first').value), step = +state.event.interval || 30;
    if (f == null) { toast('Ange första starttid'); return; }
    state.heats.forEach((h, i) => h.time = minTxt(f + i * step)); save(); render(); toast(`Planerade tider satta, ${step} min mellan`);
  }
  else if (a === 'add-heat') {
    const last = state.heats[state.heats.length - 1], m = toMin(last?.time);
    state.heats.push({ id:uid(), title:`Heat ${state.heats.length + 1}`, time: m != null ? minTxt(m + (+state.event.interval || 30)) : '08:30', lanes:'', startedAt:null });
    save(); render();
  }
  else if (a === 'del-heat') {
    const h = state.heats[+b.dataset.i];
    if (h.startedAt) { toast('Starten har gått. Nollställ den först under Tidtagning.'); return; }
    state.heats.splice(+b.dataset.i, 1); save(); render(); toast(`${h.title} borttagen`);
  }
  else if (a === 'csv') {
    const rows = allResults();
    const lines = [['Placering i klass', 'Nr', 'Klass', 'Deltagare', 'Start', 'Starttid', 'Tid'].join(';')]
      .concat(rows.map(r => [r.place ?? '', r.e.nr, r.e.cls, names(r.e), r.h.title, r.h.startedAt ? fmtClock(r.h.startedAt, true) : '', r.dnf ? 'DNF' : r.ms != null ? fmtTime(r.ms) : ''].map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')));
    download(`hyrox-resultat-${state.event.date || 'event'}.csv`, '﻿' + lines.join('\n'), 'text/csv');
  }
  else if (a === 'backup') download(`hyrox-backup-${fmtClock(Date.now()).replace(':', '')}.json`, JSON.stringify(state, null, 2), 'application/json');
  else if (a === 'ask-clear-times' || a === 'ask-seed') {
    const q = a === 'ask-seed' ? 'Ersätt startlistan med originalet och rensa alla tider?' : 'Starta om allt? Alla starter och tider raderas, startlistan ligger kvar.';
    $('#reset-box').innerHTML = `<span>${q} Det går inte att ångra.</span><button class="btn danger" type="button" data-act="${a.slice(4)}">Ja</button><button class="btn ghost" type="button" data-act="tab" data-tab="inst">Avbryt</button>`;
  }
  else if (a === 'clear-times') { state.heats.forEach(h => h.startedAt = null); state.res = {}; state.event.autoSkip = null; ui.pending = null; ui.upSel = null; ui.tab = 'tid'; save(); render(); scrollTo(0, 0); toast('Allt är nollställt. Start 1 är redo.'); }
  else if (a === 'seed') { const ev = state.event; state = seed(); state.event = ev; save(); render(); toast('Originalstartlistan återställd'); }
});

// Håll skärmen vaken under tidtagning
function wake() { navigator.wakeLock?.request('screen').catch(() => {}); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); autoTick(Date.now()); render(); } });
document.addEventListener('pointerdown', wake, { once:true });
document.addEventListener('pointerdown', () => ac());   // låser upp ljudet så att automatiska nedräkningar hörs
// Varna om man stänger fliken under pågående lopp
window.addEventListener('beforeunload', e => { if (state.heats.some(h => heatStatus(h) === 'run')) { e.preventDefault(); e.returnValue = ''; } });

load(); render();
if (ui.newList) toast('Ny startlista inläst (7 nov, nr 1–51). Tidigare testtider är rensade.');
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
