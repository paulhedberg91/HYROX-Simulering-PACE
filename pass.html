<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PACE Pass-timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PACE Pass">
<meta name="theme-color" content="#0A0F1C">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600;700&family=Big+Shoulders+Display:wght@800;900&display=swap">
<style>
/* Layout: TV/iPad i liggande läge. Vänster: blocket som pågår och rörelserna. Höger: stor nedräkning för blocket. Botten: tidslinje för hela passet. Mörkt tema som i HYROX-appen. */
:root{
  --ink:#0A0F1C; --panel:#111a2c; --panel-2:#172238; --line:#25314c; --text:#eef2fa; --muted:#8e9bb8;
  --b1:#3ba7e6; --b2:#ff8a1f; --rest:#8e9bb8; --b3:#3be08a; --b4:#b18cff; --warn:#ffcf4a;
  --c:var(--b1);
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --u:min(1vw,1.78vh);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(80% 70% at 70% 20%, color-mix(in srgb,var(--c) 14%,var(--ink)) 0%, var(--ink) 70%) fixed, var(--ink);color:var(--text);font-family:var(--font-body);overflow:hidden;transition:background .6s}
button{font:inherit;color:inherit}
.stage{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:calc(var(--u)*2);padding:calc(var(--u)*2.4) max(calc(var(--u)*3.2),env(safe-area-inset-right,0px)) calc(var(--u)*2.2) max(calc(var(--u)*3.2),env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2)}
.brand{display:flex;align-items:center;gap:calc(var(--u)*1.8);min-width:0;flex:1}
.brand img{flex:none}
.topr{flex:none}
.brand img{height:calc(var(--u)*5.6);width:auto}
.brand .t{border-left:1px solid var(--line);padding-left:calc(var(--u)*1.8);min-width:0}
.brand .t b{display:block;font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:calc(var(--u)*3.2);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .t span{display:block;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:calc(var(--u)*1.2);color:var(--muted);margin-top:.4em}
.clock{font-family:var(--font-num);font-weight:700;font-size:calc(var(--u)*4);line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}

.main{display:grid;grid-template-columns:1.15fr 1fr;gap:calc(var(--u)*2.4);min-height:0}
.card{background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*2.6);min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.4);overflow:hidden}
.tag{align-self:flex-start;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:calc(var(--u)*1.35);padding:.45em 1em;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);border:2px solid var(--c);color:#fff}
.bname{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:calc(var(--u)*6.4);line-height:.92;text-wrap:balance}
.moves{list-style:none;margin:0;padding:0;display:grid;gap:calc(var(--u)*1)}
.moves li{display:grid;grid-template-columns:calc(var(--u)*1.2) 1fr;gap:calc(var(--u)*1.2);align-items:baseline;font-size:calc(var(--u)*2.5);font-weight:600;line-height:1.2}
.moves li::before{content:"";width:calc(var(--u)*1);height:calc(var(--u)*1);border-radius:2px;background:var(--c);transform:translateY(-.15em)}
.moves.roomy li:first-child{font-size:calc(var(--u)*5.2);font-family:var(--font-display);font-weight:900;line-height:1}
.moves.roomy li:first-child::before{width:calc(var(--u)*1.6);height:calc(var(--u)*1.6)}
.moves.dense{gap:calc(var(--u)*.7)}
.moves.dense li{font-size:calc(var(--u)*2.1)}
.moves.dense li.sub{font-size:calc(var(--u)*1.8)}
.moves li.sub{font-size:calc(var(--u)*2);color:var(--muted);font-weight:500}
.moves li.sub::before{background:transparent;border:2px solid var(--line)}
.note{color:var(--muted);font-size:calc(var(--u)*1.6);font-weight:600}

.tcard{align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*1.2)}
.tlbl{font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:calc(var(--u)*1.5);color:var(--muted)}
.big{font-family:var(--font-display);font-weight:900;line-height:.85;font-size:min(calc(var(--u)*15),24vh);transition:font-size .3s;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 calc(var(--u)*3) color-mix(in srgb,var(--c) 60%,transparent)}
.big.hot{color:var(--c)}
.tcard.hasres{gap:calc(var(--u)*.9)}
.tcard.hasres .big{font-size:min(calc(var(--u)*10.5),17vh)}
.rounds{display:flex;gap:calc(var(--u)*1)}
.rounds i{font-style:normal;font-family:var(--font-num);font-weight:700;font-size:calc(var(--u)*2.4);width:calc(var(--u)*5);height:calc(var(--u)*5);display:grid;place-items:center;border-radius:calc(var(--u)*1);border:2px solid var(--line);color:var(--muted)}
.rounds i.done{background:color-mix(in srgb,var(--c) 30%,transparent);border-color:var(--c);color:#fff}
.rounds i.now{background:var(--c);border-color:var(--c);color:#06121f}
.total{display:flex;gap:calc(var(--u)*3);font-family:var(--font-num);font-weight:600;font-size:calc(var(--u)*2.2);color:var(--muted);font-variant-numeric:tabular-nums}
.total b{color:var(--text)}
.next{font-size:calc(var(--u)*1.8);color:var(--muted);font-weight:600}
.next b{color:var(--text)}

.bottom{display:grid;gap:calc(var(--u)*1)}
.tl{position:relative;display:flex;height:max(calc(var(--u)*3.6),44px);border-radius:calc(var(--u)*.9);overflow:hidden;border:1px solid var(--line)}
.tl .seg{cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0 2px;font-size:max(calc(var(--u)*1.15),10px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;color:#fff;background:color-mix(in srgb,var(--sc) 22%,var(--panel));border-right:1px solid var(--ink)}
.tl .seg:hover{filter:brightness(1.25)}
.tl .seg.sel{box-shadow:inset 0 0 0 3px #fff}
.tl .seg.past{background:color-mix(in srgb,var(--sc) 55%,var(--panel))}
.tl .now{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;box-shadow:0 0 10px #fff;transition:left .25s linear}
.ticks{position:relative;height:1.3em;font-family:var(--font-num);font-size:calc(var(--u)*1.2);color:var(--muted);font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;transition:opacity .4s}
.ctl.hide{opacity:0;pointer-events:none}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;min-height:46px}
.btn.go{background:var(--b3);border-color:var(--b3);color:#04140b}
.btn.go2{background:transparent;border-color:var(--b3);color:var(--b3)}
.btn.danger{color:#ff5d6c;background:transparent}

/* Klar-knapp och resultat */
.tcard>*{flex-shrink:0}
.donebtn{appearance:none;line-height:1.1;border:0;border-radius:calc(var(--u)*1.4);background:var(--b3);color:#04140b;font-family:var(--font-display);font-weight:900;text-transform:uppercase;letter-spacing:.04em;font-size:calc(var(--u)*3.4);padding:calc(var(--u)*.9) calc(var(--u)*4);cursor:pointer;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*2.4) color-mix(in srgb,var(--b3) 35%,transparent);min-height:56px}
.donebtn:active{transform:scale(.97)}
.donebtn.undo{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none;font-family:var(--font-body);font-size:calc(var(--u)*1.5);font-weight:700;letter-spacing:.06em;padding:calc(var(--u)*.6) calc(var(--u)*2);min-height:40px}
.res{display:grid;gap:calc(var(--u)*.4);justify-items:center;font-size:calc(var(--u)*1.7);color:var(--muted);font-weight:600}
.res:empty{display:none}
.res .done{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:calc(var(--u)*3.4);color:var(--b3);line-height:1}
.res b{color:var(--text)}
.good{color:var(--b3)!important}.bad{color:#ff7a85!important}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--u)*.5) calc(var(--u)*2.4)}
body.fin .main{grid-template-columns:1.8fr 1fr}
body.fin .bname{font-size:calc(var(--u)*4)}
.sum div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:calc(var(--u)*1);align-items:baseline;padding:calc(var(--u)*.3) 0;border-bottom:1px solid var(--line);font-size:min(calc(var(--u)*1.55),2.5vh)}
.sum .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum div b{font-family:var(--font-num);font-size:1.25em;font-variant-numeric:tabular-nums}
.sum div span:last-child{font-family:var(--font-num);font-variant-numeric:tabular-nums;min-width:3.6em;text-align:right}
.sum .nm small{color:var(--muted);margin-left:.4em}
/* Nedräkning före start + övergångar */
#ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;align-content:center;text-align:center;gap:2vmin;background:radial-gradient(60% 60% at 50% 50%, color-mix(in srgb,var(--oc,#3ba7e6) 24%,var(--ink)) 0%, var(--ink) 75%)}
#ov .l1{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:clamp(34px,8vmin,100px);padding:.1em .5em;border-radius:.25em;border:.06em solid var(--oc,#3ba7e6);background:color-mix(in srgb,var(--oc,#3ba7e6) 25%,transparent)}
#ov .l2{font-weight:700;letter-spacing:.3em;text-transform:uppercase;font-size:clamp(14px,2.6vmin,28px);color:var(--muted)}
#ov .n{font-family:var(--font-display);font-weight:900;line-height:.85;font-size:min(48vh,46vw);color:#fff;-webkit-text-stroke:.5vmin var(--oc,#3ba7e6);text-shadow:0 0 6vmin var(--oc,#3ba7e6)}
#ov .n.word{font-size:min(30vh,24vw)}
#ov .n.word.long{font-size:min(20vh,11vw)}
#ov.pop .n{animation:slam .5s cubic-bezier(.15,1.15,.35,1)}
@keyframes slam{from{transform:scale(1.35);opacity:.4}to{transform:none;opacity:1}}
#ov .sub{font-size:clamp(14px,2.2vmin,24px);color:var(--muted);font-weight:600}
#ed{position:fixed;inset:0;z-index:60;background:rgba(5,8,15,.82);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));cursor:auto}
.ed-box{width:min(100%,980px);max-height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;min-height:0}
.ed-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ed-h b{display:block;font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:28px;line-height:1}
.ed-h span{display:block;color:var(--muted);font-size:14px;margin-top:6px;max-width:60ch}
.ed-list{overflow:auto;display:grid;gap:10px;min-height:0;padding-right:4px}
.ed-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border-radius:12px;background:var(--panel-2);border-left:5px solid var(--sc)}
.ed-row .nm{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:22px;line-height:1.1}
.ed-row .nm small{display:block;font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:none;margin-top:4px}
.ed-row .fs{display:grid;gap:6px}
.ed-row input{width:100%;min-height:44px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:17px;color:var(--text)}
.ed-row input.sub{font-size:15px;color:var(--muted)}
.ed-row input.chg{border-color:var(--b3)}
@media (max-width:640px){.ed-row{grid-template-columns:1fr}}
.topr{display:flex;align-items:center;gap:calc(var(--u)*2.4)}
@media (max-width:600px){.brand .t{display:none}.clock{display:none}.ticks{display:none}.upnext,.moves li.sub{display:none}.tl .seg{font-size:0}.card{padding:calc(var(--u)*2)}.ctl{gap:6px}.btn{padding:8px 12px;min-height:44px;font-size:14px}}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line)}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:max(14px,calc(var(--u)*1.4));padding:8px 18px;border-radius:999px;cursor:pointer;min-height:40px}
.tab.on{background:var(--text);color:var(--ink)}
#rs{position:fixed;inset:max(calc(var(--u)*11),72px) 0 0;z-index:40;display:grid;padding:0 max(calc(var(--u)*3.2),env(safe-area-inset-right,0px)) calc(var(--u)*2.2) max(calc(var(--u)*3.2),env(safe-area-inset-left,0px));background:var(--ink);cursor:auto}
.rs-box{display:grid;grid-template-rows:auto 1fr;gap:14px;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.rs-list{overflow:auto;display:grid;grid-auto-rows:max-content;gap:14px;align-content:start;min-height:0}
.rs-s{border:1px solid var(--line);border-radius:14px;background:var(--panel-2);overflow:hidden}
.rs-s.cur{border-color:var(--b3)}
.rs-sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.rs-sh .d{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:22px}
.rs-sh .d small{font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--b3);margin-left:8px}
.rs-sh .tt{font-family:var(--font-num);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.rs-sh .tt span{color:var(--muted);font-weight:600;font-size:15px;margin-right:6px}
.rs-tw{overflow-x:auto}
.rs-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:460px}
.rs-t th,.rs-t td{padding:8px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:16px}
.rs-t th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rs-t td.n{font-family:var(--font-num);font-weight:700;font-size:20px}
.rs-t td.dl{font-family:var(--font-num);font-weight:700;font-size:18px}
.rs-t tr:last-child td{border-bottom:0}
.rs-t .w{color:var(--muted);font-size:13px;margin-left:6px}
.rs-del{appearance:none;background:transparent;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
body.paused .big{opacity:.4}
body.paused .tlbl{color:var(--warn);font-size:calc(var(--u)*2.6);letter-spacing:.2em}
.bottom{position:relative;grid-template-columns:minmax(0,1fr)}
.tl .seg{min-width:0;letter-spacing:0}
.ctlhint{position:absolute;left:0;right:0;bottom:0;height:46px;display:grid;place-items:center;color:var(--muted);font-size:max(13px,calc(var(--u)*1.2));font-weight:600;letter-spacing:.08em;opacity:0;transition:opacity .4s;pointer-events:none}
.ctl.hide+.ctlhint{opacity:.55}
#undo{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:14px;background:var(--text);color:var(--ink);padding:8px 8px 8px 18px;border-radius:999px;font-weight:700;font-size:16px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
#undo button{appearance:none;border:0;background:var(--ink);color:var(--text);font:inherit;padding:10px 18px;border-radius:999px;cursor:pointer;min-height:44px;white-space:nowrap}
.upnext{margin-top:auto;display:grid;gap:.25em;padding-top:calc(var(--u)*1.4);border-top:1px solid var(--line)}
.upnext:empty{display:none}
.upnext span{font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:calc(var(--u)*1.25);color:var(--muted)}
.upnext b{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:calc(var(--u)*2.8);line-height:1}
.upnext b small{font-family:var(--font-body);font-weight:600;text-transform:none;font-size:.55em;color:var(--muted);margin-left:.5em}
.card.roomy .bname{font-size:calc(var(--u)*7.4)}
.card.roomy .moves.roomy li:first-child{font-size:calc(var(--u)*5.6)}
.note:empty{display:none}
[hidden]{display:none!important}
@media (max-aspect-ratio:1/1){:root{--u:min(1.9vw,1.05vh)}.main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.big{font-size:min(calc(var(--u)*19),17vh)}.tcard.hasres .big{font-size:min(calc(var(--u)*13),11vh)}.brand .t span{display:none}body.fin .main{grid-template-columns:1fr}.sum{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#ov.pop .n{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <div class="brand"><img src="assets/pace.png" alt="PACE Performance &amp; Training"><div class="t"><b id="w-title"></b><span id="w-format"></span></div></div>
    <div class="topr">
      <div class="tabs" role="tablist"><button class="tab on" type="button" role="tab" id="tab-timer" aria-selected="true">Timer</button><button class="tab" type="button" role="tab" id="tab-res" aria-selected="false">Resultat</button></div>
      <div class="clock" id="clock">00:00</div>
    </div>
  </div>
  <div class="main">
    <div class="card">
      <div class="tag" id="b-tag"></div>
      <div class="bname" id="b-name"></div>
      <ul class="moves" id="b-moves"></ul>
      <div class="note" id="b-note"></div>
      <div class="upnext" id="b-up"></div>
    </div>
    <div class="card tcard">
      <div class="tlbl" id="t-lbl">Kvar av blocket</div>
      <div class="big" id="t-big">15:00</div>
      <div class="rounds" id="t-rounds" hidden></div>
      <div class="total"><span>Totalt <b id="t-el">0:00</b></span><span>Kvar av passet <b id="t-left">52:00</b></span></div>
      <div class="res" id="t-res"></div>
      <button class="donebtn" type="button" id="b-done" hidden>✓ Klar</button>
      <div class="next" id="t-next"></div>
    </div>
  </div>
  <div class="bottom">
    <div class="tl" id="tl"><div class="now" id="tl-now"></div></div>
    <div class="ticks" id="ticks"></div>
    <div class="ctl" id="ctl">
      <select class="btn" id="w-pick" aria-label="Välj pass"></select>
      <button class="btn go" type="button" id="b-start">▶ Starta passet (10 s nedräkning)</button>
      <button class="btn go2" type="button" id="b-now">⚡ Starta direkt</button>
      <button class="btn" type="button" id="b-edit">✎ Ändra upplägg</button>
      <button class="btn" type="button" id="b-prev" aria-label="Föregående block">⏮ Föregående</button>
      <button class="btn" type="button" id="b-pause" hidden>❚❚ Paus</button>
      <button class="btn" type="button" id="b-next" aria-label="Nästa block">Nästa ⏭</button>
      <button class="btn danger" type="button" id="b-reset" hidden>↺ Börja om</button>
    </div>
    <div class="ctlhint">Tryck på skärmen för knappar</div>
  </div>
</div>
<div id="rs" hidden role="tabpanel" aria-label="Resultat">
  <div class="rs-box">
    <div class="ed-h"><div><b>Resultat</b><span id="rs-sub"></span></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" type="button" id="rs-csv">Exportera CSV</button><button class="btn" type="button" id="rs-close">Till timern</button></div></div>
    <div class="rs-list" id="rs-list"></div>
  </div>
</div>

</div>
<div id="ov" hidden><div class="l1" id="ov-l1"></div><div class="l2" id="ov-l2"></div><div class="n" id="ov-n"></div><div class="sub" id="ov-sub"></div></div>

<script>
(() => {
'use strict';
/* ============ PASSET – ändra här för nästa pass ============ */
// Stationspass: varje station har ett fast tidsfönster – gör jobbet och vila resten av tiden
const ST = [
  [3, 'Row', '500 m', 'b1'], [2, 'DL', '7 reps', 'b2'], [2, 'R-L', '14 reps', 'b2'], [3, 'Ski', '500 m', 'b1'],
  [2, 'S-Press', '7 reps', 'b2'], [2, 'Burpee over plate', '14 reps', 'b2'], [3, 'Bike', '1000 m', 'b1'], [3, 'Run', '300–400 m', 'b4'],
];
function stationBlocks(rounds, restMin) {

  for (let r = 1; r <= rounds; r++) {
    for (const [min, name, work, color] of ST) {
      out.push({ from: t * 60, to: (t + min) * 60, tag: `Varv ${r} av ${rounds} · Min ${t}–${t + min}`, name, color, moves: [work, { sub: 'Vila resten av tiden' }] });

    }
    if (r < rounds) { out.push({ from: t * 60, to: (t + restMin) * 60, tag: `Vila · Min ${t}–${t + restMin}`, name: `Vila ${restMin} min`, color: 'rest', rest: true, moves: [`Nästa: varv ${r + 1}`, 'Gör dig redo vid rodden'] }); t += restMin; }
  }
  return out;
}
const WODS = [
  {
    id: '2026-11-11-0600',
    title: 'Onsdag 11/11 · 06:00',
    format: 'For time · Time cap 52 min · Par',
    cap: 52 * 60,
    blocks: [
      { from: 0, to: 15 * 60, tag: 'Block 1 · Min 0–15', name: 'Front Squats', color: 'b1',
        moves: ['Sätt 1RM – atlet 1', 'Sätt 3RM – atlet 2'] },
      { from: 15 * 60, to: 29 * 60, tag: 'Block 2 · Min 15–29', name: '4 ronder', color: 'b2', rounds: 4,
        moves: ['10 SYNC pull-ups', '18 HPS @ 40/30 kg', '14 box step-ups', { sub: 'Varannan rep: P1 – P2 – P1 – P2' }],
        note: '3:30 per rond' },
      { from: 29 * 60, to: 33 * 60, tag: 'Vila · Min 29–33', name: 'Vila 4 min', color: 'rest', rest: true,
        moves: ['Ställ i ordning bike, ski och row', 'Förbered thrusters, lunges & wallballs'] },
      { from: 33 * 60, to: 36 * 60, tag: 'Block 3 · Min 33–52 · X-distance ladder', name: 'Bike erg 3 min', color: 'b3',
        moves: ['3 min bike erg', { sub: 'Notera distansen = X' }] },
      { from: 36 * 60, to: 52 * 60, tag: 'Block 3 · X-distance ladder', name: 'Ladder', color: 'b3',
        moves: ['Ski erg: halva bike-distansen', 'Row erg: 3 min', 'Bike erg: dubbla distansen', { sub: 'Resten av tiden – 21-15-9-15-21:' }, 'Thrusters · OH R-lunges · Wallballs'],

  },
  {
    id: '2026-11-stationer-2x20',

// Valt pass: adressens #id, annars senast valda, annars det senaste i listan
let selId = location.hash.slice(1);
try { selId = selId || localStorage.getItem('pace-pass-sel') || ''; } catch (e) {}
const WOD = WODS.find(w => w.id === selId) || WODS[WODS.length - 1];
/* =========================================================== */

const KEY = 'pace-pass2-' + WOD.id;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmt = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colorOf = b => `var(--${b.color})`;
const CD = 10;   // sekunders nedräkning före start
// Egna ändringar av upplägget (vikter, distanser, reps) – sparas per pass på enheten, gäller alla block med samma namn
const OKEY = 'pace-pass-edit-' + WOD.id;
const ORIG = WOD.blocks.map(b => JSON.parse(JSON.stringify(b.moves)));
let edits = {};
try { edits = JSON.parse(localStorage.getItem(OKEY) || '{}'); } catch (e) {}
if (edits['Burpee Place']) { edits['Burpee over plate'] = edits['Burpee Place']; delete edits['Burpee Place']; }   // gammalt namn
function applyEdits() { WOD.blocks.forEach((b, i) => { b.moves = edits[b.name] ? JSON.parse(JSON.stringify(edits[b.name])) : JSON.parse(JSON.stringify(ORIG[i])); }); }
applyEdits();
const B = WOD.blocks, N = B.length;
const dur = i => B[i].to - B[i].from;               // sekvensens längd i sekunder
const TOTAL = B.reduce((n, b, i) => n + dur(i), 0);
const before = i => { let n = 0; for (let k = 0; k < i; k++) n += dur(k); return n; };

/* Sekvenser: passet består av sekvenser i ordning. Varje sekvens har sin egen nedräkning.
   Hoppar man till en sekvens (t.ex. Burpees) startar den från början och resten följer efter. */
let st = { seq: 0, seqStart: null, workStart: null, pausedAt: null, finished: null, results: {} };
try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
st.results = st.results || {};

// Historik: tidigare genomförda pass med tider per sekvens (sparas på enheten)
const HKEY = 'pace-pass-hist-' + WOD.id;
let hist = [];
try { hist = JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (e) {}
const saveHist = () => { try { localStorage.setItem(HKEY, JSON.stringify(hist)); } catch (e) {} };
function archive() {   // spara pågående pass i historiken (en gång) om något är klarmarkerat
  if (st.archived || !Object.keys(st.results).length) return;
  hist.push({ date: st.workStart || Date.now(), results: st.results, total: st.finished ? (st.finished - st.workStart) / 1000 : null, edits: JSON.parse(JSON.stringify(edits)) }); saveHist(); st.archived = true;
}
const fmtS = sec => `${Math.floor(sec / 60)}:${pad(Math.floor(sec % 60))}`;
function compare(i, r) {   // jämför med förra gången och bästa tid för sekvensen
  const prevs = hist.filter(h => h.results[i] != null);
  const last = prevs.length ? prevs[prevs.length - 1].results[i] : null;
  const best = prevs.length ? Math.min(...prevs.map(h => h.results[i])) : null;
  const delta = (a, b) => { const d = Math.round(a - b); return `<span class="${d < 0 ? 'good' : d > 0 ? 'bad' : ''}">${d < 0 ? '−' : d > 0 ? '+' : '±'}${fmtS(Math.abs(d))}</span>`; };
  return { last, best, html: r == null
    ? (last != null ? `Förra gången <b>${fmtS(last)}</b> · Bästa <b>${fmtS(best)}</b>` : '')
    : (last != null ? `${delta(r, last)} mot förra (${fmtS(last)}) · Bästa <b>${fmtS(Math.min(best, r))}</b>${r < best ? ' · <span class="good">Nytt rekord!</span>' : ''}` : 'Första gången – nu har du en tid att slå') };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const nowMs = () => st.pausedAt || Date.now();
const started = () => st.seqStart != null;
let sel = 0;   // vald startsekvens innan passet börjar

$('w-title').textContent = WOD.title; $('w-format').textContent = WOD.format;
$('w-pick').innerHTML = WODS.map(w => `<option value="${w.id}"${w.id === WOD.id ? ' selected' : ''}>${esc(w.title)}</option>`).join('');
$('w-pick').addEventListener('change', e => { try { localStorage.setItem('pace-pass-sel', e.target.value); } catch (x) {} location.hash = e.target.value; location.reload(); });

// Tidslinje (långa namn förkortas till initialer, t.ex. Burpee over plate → BOP)
const shortName = n => n.length > 8 && /\s/.test(n) ? n.split(/\s+/).map(w => w[0]).join('').toUpperCase() : n;
const tl = $('tl');
tl.insertAdjacentHTML('afterbegin', B.map((b, i) => `<div class="seg" data-i="${i}" style="flex:${dur(i)};--sc:${colorOf(b)}">${esc(b.rest ? 'Vila' : shortName(b.name))}</div>`).join(''));
const segs = [...tl.querySelectorAll('.seg')];
const marks = [0, ...B.map((b, i) => before(i + 1))];
$('ticks').innerHTML = [...new Set(marks)].map(m => `<span style="position:absolute;left:${m / TOTAL * 100}%;transform:translateX(${m === 0 ? '0' : m === TOTAL ? '-100%' : '-50%'})">${m / 60}</span>`).join('');

// Ljud
let audio;
function ac() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch (e) {} return audio; }
function tone(f, d, vol = .25, type = 'triangle') {
  const a = ac(); if (!a) return;
  const t = a.currentTime + .01, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);

const beepShort = () => tone(660, .16, .3, 'square');
const beepLong = () => tone(990, .7, .3, 'square');

// Visa sekvens
let shownBlock = -1, shownRound = -1, lastBeep = null;
function renderBlock(i) {
  const b = B[i];
  document.body.classList.remove('fin');
  if ($('b-moves').tagName !== 'UL') $('b-moves').outerHTML = '<ul class="moves" id="b-moves"></ul>';
  document.documentElement.style.setProperty('--c', colorOf(b));
  $('b-tag').textContent = b.tag; $('b-name').textContent = b.name;
  $('b-moves').classList.toggle('dense', b.moves.length > 4);
  $('b-moves').classList.toggle('roomy', b.moves.length <= 2 && !b.rest);
  $('b-moves').innerHTML = b.moves.map(m => typeof m === 'string' ? `<li>${esc(m)}</li>` : `<li class="sub">${esc(m.sub)}</li>`).join('');
  $('b-note').textContent = b.note || '';
  $('b-tag').closest('.card').classList.toggle('roomy', b.moves.length <= 2 && !b.rest);
  const nb = B[i + 1], nw = nb && typeof nb.moves[0] === 'string' && !nb.rest ? nb.moves[0] : '';
  $('b-up').innerHTML = nb ? `<span>Sedan</span><b>${esc(nb.name)}${nw ? `<small>${esc(nw)}</small>` : ''}</b>` : '';
  $('t-rounds').hidden = !b.rounds;
  if (b.rounds) $('t-rounds').innerHTML = Array.from({ length: b.rounds }, (_, k) => `<i>${k + 1}</i>`).join('');
}

// Övergångsskylt (kort, utan blink)
let ovT;
function flashCard(l1, l2, word, color, ms = 2200) {
  const ov = $('ov'); clearTimeout(ovT);
  ov.style.setProperty('--oc', color);
  $('ov-l1').textContent = l1; $('ov-l2').textContent = l2 || ''; $('ov-n').textContent = word; $('ov-n').className = 'n word' + (word.length > 6 ? ' long' : ''); $('ov-sub').textContent = '';
  ov.hidden = false; ov.classList.remove('pop'); void ov.offsetWidth; ov.classList.add('pop');
  ovT = setTimeout(() => ov.hidden = true, ms);
}

// Gå vidare till nästa sekvens när tiden är slut (exakt, även efter omladdning)
function advance() {
  if (!started() || st.finished || st.pausedAt) return;
  const now = Date.now();
  while (now - st.seqStart >= dur(st.seq) * 1000) {
    st.seqStart += dur(st.seq) * 1000; st.seq++;
    if (st.seq >= N) { st.seq = N - 1; st.finished = st.seqStart; break; }
  }
  save();
}

function renderSummary() {   // efter passet: alla tider jämfört med förra gången
  const prevHist = st.archived ? hist.slice(0, -1) : hist;   // senaste posten är det här passet
  document.documentElement.style.setProperty('--c', 'var(--b3)');
  $('b-tag').textContent = 'Passet klart'; $('b-name').textContent = 'Dina tider'; $('b-note').textContent = '';
  $('t-rounds').hidden = true;
  let rows = B.map((b, i) => ({ b, i })).filter(x => !x.b.rest);
  const has = ({ i }) => st.results[i] != null || prevHist.some(h => h.results[i] != null);
  if (rows.some(has)) rows = rows.filter(has);   // visa bara sekvenser med tider
  const varv = b => (/^Varv (\d+)/.exec(b.tag) || [])[1];
  const work = b => typeof b.moves[0] === 'string' ? b.moves[0] : '';
  $('b-moves').className = 'moves'; $('b-moves').outerHTML = `<div class="sum" id="b-moves">${rows.map(({ b, i }) => {
    const r = st.results[i], ps = prevHist.filter(h => h.results[i] != null), last = ps.length ? ps[ps.length - 1].results[i] : null;
    const d = r != null && last != null ? Math.round(r - last) : null;
    return `<div><span class="nm">${varv(b) ? `<small style="margin:0 .5em 0 0">V${varv(b)}</small>` : ''}${esc(b.name)}<small>${esc(work(b))}</small></span><b>${r != null ? fmtS(r) : '–'}</b><span class="${d == null ? '' : d < 0 ? 'good' : d > 0 ? 'bad' : ''}">${d == null ? (last != null ? fmtS(last) : '') : (d < 0 ? '−' : d > 0 ? '+' : '±') + fmtS(Math.abs(d))}</span></div>`;
  }).join('')}</div>`;
}
function renderDone(i, inSeq) {   // Klar-knappen och resultatraden för sekvensen som pågår
  const b = B[i], r = st.results[i], can = started() && inSeq >= 0 && !st.finished && !b.rest;
  $('b-done').hidden = !can;
  document.querySelector('.tcard').classList.toggle('hasres', can && r != null);
  if (!can) { $('t-res').innerHTML = ''; return; }
  const c = compare(i, r);
  if (r != null) {
    $('b-done').textContent = 'Ångra klar'; $('b-done').className = 'donebtn undo';
    $('t-res').innerHTML = `<div class="done">✓ Klar på ${fmtS(r)}</div><div>${c.html}</div>`;
  } else {
    $('b-done').textContent = '✓ Klar'; $('b-done').className = 'donebtn';
    $('t-res').innerHTML = c.html ? `<div>${c.html}</div>` : '';
  }
}
function preview(i) {   // innan start: visa vald startsekvens
  if (shownBlock !== i) { renderBlock(i); shownBlock = i; }
  $('t-big').textContent = fmt(dur(i)); $('t-big').classList.remove('hot');
  $('t-lbl').textContent = i ? 'Startar här' : 'Kvar av sekvensen';
  $('t-el').textContent = '0:00'; $('t-left').textContent = fmt(TOTAL - before(i));
  $('t-next').innerHTML = B[i + 1] ? `Sedan: <b>${esc(B[i + 1].name)}</b>` : '';
  $('b-done').hidden = true; const c = compare(i, null); $('t-res').innerHTML = c.html ? `<div>${c.html}</div>` : '';
  $('tl-now').style.left = (before(i) / TOTAL * 100) + '%';
  segs.forEach((s, k) => { s.classList.toggle('past', k < i); s.classList.toggle('sel', k === i && !started()); });
}

function tick() {
  const d = new Date();
  $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  advance();
  const run = started() && !st.pausedAt && !st.finished;
  $('b-start').hidden = started(); $('b-now').hidden = started(); $('w-pick').hidden = started(); $('b-pause').hidden = !started() || !!st.finished; $('b-prev').hidden = !started() && sel === 0; $('b-reset').hidden = !started();
  $('b-start').textContent = sel ? `▶ Starta från ${B[sel].name} (10 s)` : '▶ Starta med nedräkning (10 s)';
  $('b-now').textContent = sel ? `⚡ Starta direkt från ${B[sel].name}` : '⚡ Starta direkt';
  $('b-pause').textContent = st.pausedAt ? '▶ Fortsätt' : '❚❚ Paus';
  document.body.classList.toggle('paused', !!st.pausedAt);

  if (!started()) { preview(sel); return; }
  const inSeq = (nowMs() - st.seqStart) / 1000;

  // Nedräkning före start
  if (inSeq < 0) {
    preview(st.seq);
    const s = Math.ceil(-inSeq), ov = $('ov');
    ov.hidden = false; ov.style.setProperty('--oc', s > 5 ? 'var(--b1)' : s > 1 ? 'var(--b2)' : 'var(--b3)');
    $('ov-l1').textContent = WOD.title.split('·')[0].trim(); $('ov-l2').textContent = 'Startar om';
    if ($('ov-n').textContent !== String(s)) {
      $('ov-n').textContent = s; $('ov-n').className = 'n'; ov.classList.remove('pop'); void ov.offsetWidth; ov.classList.add('pop');
      $('ov-sub').textContent = B[st.seq].name;
      if (s <= 3 && lastBeep !== 'cd' + s) { lastBeep = 'cd' + s; beepShort(); }
    }
    return;
  }
  if (lastBeep !== 'go' && (nowMs() - st.workStart) < 2000) { lastBeep = 'go'; beepLong(); flashCard(B[st.seq].tag, '', 'GOGO!', 'var(--b3)', 1800); shownBlock = st.seq; renderBlock(st.seq); shownRound = -1; }

  const total = (nowMs() - st.workStart) / 1000;
  if (st.finished) {
    if (!st.archived) { archive(); save(); }
    $('b-done').hidden = true; $('t-res').innerHTML = '';
    if (shownBlock !== 'sum') { document.body.classList.add('fin'); renderSummary(); shownBlock = 'sum'; }
    $('t-big').textContent = '0:00'; $('t-big').classList.remove('hot'); $('t-lbl').textContent = 'Klart';
    $('t-el').textContent = fmt(Math.floor((st.finished - st.workStart) / 1000)); $('t-left').textContent = '0:00';
    $('tl-now').style.left = '100%'; segs.forEach(s => s.classList.add('past'));
    $('t-next').innerHTML = '<b>Bra jobbat!</b>';
    if (lastBeep !== 'cap') { lastBeep = 'cap'; if (Date.now() - st.finished < 5000) { beepLong(); flashCard('Passet är klart', WOD.title, 'TIME!', 'var(--warn)', 6000); } }
    return;
  }

  const i = st.seq, b = B[i];
  if (i !== shownBlock) {

    if (shownBlock !== -1) { beepLong(); flashCard(b.tag, '', b.rest ? 'VILA' : b.name.toUpperCase(), colorOf(b), 1800); }
    shownBlock = i; shownRound = -1;
  }
  let left = dur(i) - inSeq, lbl = b.rest ? 'Vila kvar' : 'Kvar av sekvensen';
  if (b.rounds) {   // ronder med egen nedräkning
    const len = dur(i) / b.rounds, r = Math.min(b.rounds - 1, Math.floor(inSeq / len));
    left = (r + 1) * len - inSeq; lbl = `Rond ${r + 1} av ${b.rounds} · kvar`;
    [...$('t-rounds').children].forEach((el, k) => el.className = k < r ? 'done' : k === r ? 'now' : '');
    if (r !== shownRound) { if (shownRound !== -1) { beepLong(); flashCard(b.tag, '', `ROND ${r + 1}`, colorOf(b), 1600); } shownRound = r; }
  }
  $('t-lbl').textContent = st.pausedAt ? '❚❚ Pausad' : lbl;
  $('t-big').textContent = fmt(left);
  $('t-big').classList.toggle('hot', left <= 10);
  const sLeft = Math.ceil(left);
  if (sLeft <= 3 && sLeft >= 1 && run && lastBeep !== `b${i}-${shownRound}-${sLeft}`) { lastBeep = `b${i}-${shownRound}-${sLeft}`; beepShort(); }
  $('t-el').textContent = fmt(Math.floor(total));
  const remain = dur(i) - inSeq + TOTAL - before(i + 1);
  $('t-left').textContent = fmt(remain);
  const nb = B[i + 1];
  $('t-next').innerHTML = nb ? `Nästa: <b>${esc(nb.name)}</b> om ${fmt(dur(i) - inSeq)}` : 'Sista sekvensen';
  renderDone(i, inSeq);
  $('tl-now').style.left = ((before(i) + inSeq) / TOTAL * 100).toFixed(2) + '%';

}
setInterval(tick, 200);

// Knappar
$('b-now').addEventListener('click', () => {   // ingen nedräkning: klockan går direkt
  ac(); const t0 = Date.now();
  st = { seq: sel, seqStart: t0, workStart: t0, pausedAt: null, finished: null, results: {} }; lastBeep = 'go'; shownBlock = -1;
  save(); beepLong(); flashCard(B[sel].tag, '', 'GOGO!', 'var(--b3)', 1200); tick(); hideSoon(); wake();
});
$('b-start').addEventListener('click', () => {
  ac(); const t0 = Date.now() + CD * 1000;
  st = { seq: sel, seqStart: t0, workStart: t0, pausedAt: null, finished: null, results: {} }; lastBeep = null; shownBlock = -1; save(); tick(); hideSoon(); wake();
});
$('b-done').addEventListener('click', () => {
  const i = st.seq;
  if (st.results[i] != null) delete st.results[i];
  else { st.results[i] = Math.max(0, (nowMs() - st.seqStart) / 1000); beepShort(); }
  save(); tick();
});
$('b-pause').addEventListener('click', () => {
  if (st.pausedAt) { const d = Date.now() - st.pausedAt; st.seqStart += d; st.workStart += d; st.pausedAt = null; } else st.pausedAt = Date.now();
  save(); tick();
});
let confirmT;
$('b-reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (b.dataset.sure) { archive(); st = { seq: 0, seqStart: null, workStart: null, pausedAt: null, finished: null, results: {} }; sel = 0; save(); shownBlock = -1; lastBeep = null; $('ov').hidden = true; b.dataset.sure = ''; b.textContent = '↺ Börja om'; tick(); return; }
  b.dataset.sure = '1'; b.textContent = 'Tryck igen för att börja om'; clearTimeout(confirmT); confirmT = setTimeout(() => { b.dataset.sure = ''; b.textContent = '↺ Börja om'; }, 3000);
});
// Knapparna göms medan passet går – tryck för att visa
let hideT;
function hideSoon() { clearTimeout(hideT); hideT = setTimeout(() => { if (started() && !st.pausedAt) { $('ctl').classList.add('hide'); } }, 4000); }

// Hoppa till en sekvens: den startar från början och resten av passet följer efter
function jumpTo(i) {
  i = Math.max(0, Math.min(N - 1, i));
  ac(); $('ov').hidden = true; clearTimeout(ovT);
  if (!started()) { sel = i; tick(); return; }              // innan start: välj var passet ska börja
  const now = nowMs();
  const snap = { st: JSON.parse(JSON.stringify(st)) };   // för Ångra
  if ((now - st.seqStart) < 0) { st.seqStart = now; st.workStart = now; lastBeep = 'go'; }   // hoppa förbi nedräkningen
  st.seq = i; st.seqStart = now; st.finished = null;
  save(); tick(); hideSoon(); wake();
  offerUndo(`Hoppade till ${B[i].name}`, snap);
}
let undoT, undoSnap;
function offerUndo(text, snap) {
  undoSnap = snap; $('undo-t').textContent = text; $('undo').hidden = false;
  clearTimeout(undoT); undoT = setTimeout(() => { $('undo').hidden = true; undoSnap = null; }, 7000);
}
$('undo-b').addEventListener('click', () => {
  if (!undoSnap) return;
  st = undoSnap.st;   // tillbaka som om hoppet aldrig hände: klockan har gått vidare under tiden
  save(); shownBlock = -1; lastBeep = 'go'; $('ov').hidden = true; clearTimeout(ovT); $('undo').hidden = true; undoSnap = null; tick();
});
$('b-next').addEventListener('click', () => jumpTo((started() ? st.seq : sel) + 1));
$('b-prev').addEventListener('click', () => {
  if (!started()) { jumpTo(sel - 1); return; }
  const inSeq = (nowMs() - st.seqStart) / 1000;
  jumpTo(inSeq > 3 && !st.finished ? st.seq : st.seq - 1);   // ett tryck = sekvensens början, inom 3 s = sekvensen innan
});
segs.forEach((el, k) => el.addEventListener('click', () => jumpTo(k)));
// Resultat-fliken: alla genomförda pass med splittider och +/- mot passet innan
function showTab(t) {
  const res = t === 'res';
  $('tab-timer').classList.toggle('on', !res); $('tab-res').classList.toggle('on', res);
  $('tab-timer').setAttribute('aria-selected', !res); $('tab-res').setAttribute('aria-selected', res);
  $('rs').hidden = !res; if (res) renderResults();
}
function renderResults() {
  const sessions = hist.map((h, k) => ({ ...h, k }));
  if (!st.archived && Object.keys(st.results || {}).length) sessions.push({ date: st.workStart, results: st.results, total: st.finished ? (st.finished - st.workStart) / 1000 : null, cur: true });
  $('rs-sub').textContent = `${WOD.title} · ${sessions.length} ${sessions.length === 1 ? 'pass' : 'pass'} sparade på den här enheten`;
  if (!sessions.length) { $('rs-list').innerHTML = '<p style="margin:0;color:var(--muted);font-size:16px">Inga resultat än. Tryck <b>✓ Klar</b> när du är klar med en sekvens under passet, så hamnar tiderna här.</p>'; return; }
  const dfmt = t => t ? new Date(t).toLocaleString('sv-SE', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
  const sign = d => { d = Math.round(d); return `<span class="${d < 0 ? 'good' : d > 0 ? 'bad' : ''}">${d < 0 ? '−' : d > 0 ? '+' : '±'}${fmtS(Math.abs(d))}</span>`; };
  const varv = b => (/^Varv (\d+)/.exec(b.tag) || [])[1];
  $('rs-list').innerHTML = sessions.slice().reverse().map(se => {
    const idx = sessions.indexOf(se), prev = sessions.slice(0, idx);
    const keys = Object.keys(se.results).map(Number).sort((a, b) => a - b);
    const sum = keys.reduce((n, i) => n + se.results[i], 0);
    const pSum = prev.length ? keys.reduce((n, i) => { const p = [...prev].reverse().find(x => x.results[i] != null); return p && n != null ? n + p.results[i] : null; }, 0) : null;
    const best = i => { const v = sessions.slice(0, idx + 1).map(x => x.results[i]).filter(v => v != null); return Math.min(...v); };
    const rows = keys.map(i => {
      const b = B[i]; if (!b) return '';
      const p = [...prev].reverse().find(x => x.results[i] != null);
      const work = se.edits && se.edits[b.name] ? se.edits[b.name][0] : (typeof b.moves[0] === 'string' ? b.moves[0] : '');
      const prevVals = prev.map(x => x.results[i]).filter(v => v != null);
      const isBest = prevVals.length && se.results[i] < Math.min(...prevVals);   // nytt rekord
      return `<tr><td>${varv(b) ? `<span class="w" style="margin:0 6px 0 0">V${varv(b)}</span>` : ''}${esc(b.name)}<span class="w">${esc(typeof work === 'string' ? work : '')}</span></td>
        <td class="n">${fmtS(se.results[i])}${isBest ? ' <span class="good" style="font-size:13px">★ Rekord</span>' : ''}</td>
        <td class="dl">${p ? sign(se.results[i] - p.results[i]) : '<span class="w" style="margin:0">–</span>'}</td>
        <td class="w">${p ? fmtS(p.results[i]) : ''}</td></tr>`;
    }).join('');
    return `<div class="rs-s ${se.cur ? 'cur' : ''}">
      <div class="rs-sh"><div class="d">${esc(dfmt(se.date))}${se.cur ? '<small>PÅGÅR</small>' : ''}</div>
        <div class="tt">${se.total != null ? `<span>Total</span>${fmtS(se.total)} · ` : ''}<span>Splits</span>${fmtS(sum)} ${pSum != null ? sign(sum - pSum) : ''}
        ${se.cur ? '' : ` <button class="rs-del" type="button" data-k="${se.k}">Ta bort</button>`}</div></div>
      <div class="rs-tw"><table class="rs-t"><thead><tr><th>Sekvens</th><th>Tid</th><th>+/−</th><th>Förra</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
  }).join('');
}
$('tab-timer').addEventListener('click', () => showTab('timer'));
$('tab-res').addEventListener('click', () => showTab('res'));
$('rs-close').addEventListener('click', () => showTab('timer'));
$('rs-csv').addEventListener('click', () => {   // alla sparade pass som en fil (öppnas i Excel/Numbers)
  const q = x => `"${String(x).replace(/"/g, '""')}"`, rows = [['Datum', 'Pass', 'Sekvens', 'Upplägg', 'Tid (s)', 'Tid'].map(q).join(';')];
  for (const h of hist) for (const i of Object.keys(h.results).map(Number).sort((a, b) => a - b)) {
    const b = B[i]; if (!b) continue;
    const work = h.edits && h.edits[b.name] ? h.edits[b.name][0] : b.moves[0];
    rows.push([new Date(h.date).toLocaleString('sv-SE'), WOD.title, (/^Varv (\d+)/.exec(b.tag) ? 'V' + /^Varv (\d+)/.exec(b.tag)[1] + ' ' : '') + b.name, typeof work === 'string' ? work : '', Math.round(h.results[i]), fmtS(h.results[i])].map(q).join(';'));
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.join('\n')], { type: 'text/csv' })); a.download = `pass-resultat-${WOD.id}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
});
$('rs-list').addEventListener('click', e => {
  const b = e.target.closest('.rs-del'); if (!b) return;
  if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Tryck igen för att ta bort'; return; }
  hist.splice(+b.dataset.k, 1); saveHist(); renderResults();
});

// Redigering av upplägget
function groups() {   // en rad per unikt sekvensnamn (t.ex. Row gäller båda varven)
  const seen = new Map();
  B.forEach((b, i) => { if (!b.rest && !seen.has(b.name)) seen.set(b.name, i); });
  return [...seen].map(([name, i]) => ({ name, i, b: B[i], n: B.filter(x => x.name === name).length }));
}
function openEditor() {
  $('ed-list').innerHTML = groups().map(({ name, i, b, n }) => `<div class="ed-row" style="--sc:${colorOf(b)}">
    <div class="nm">${esc(name)}<small>${n > 1 ? `Gäller alla ${n} varv` : esc(b.tag)}</small></div>
    <div class="fs">${b.moves.map((m, k) => { if (typeof m !== 'string' && m.sub === 'Vila resten av tiden') return ''; const sub = typeof m !== 'string', v = sub ? m.sub : m, o = ORIG[i][k], ov = o == null ? '' : typeof o === 'string' ? o : o.sub;
      return `<input id="ed-${i}-${k}" type="text" class="${sub ? 'sub' : ''}${v !== ov ? ' chg' : ''}" data-name="${esc(name)}" data-k="${k}" value="${esc(v)}" aria-label="${esc(name)} rad ${k + 1}">`; }).join('')}</div>
  </div>`).join('');
  $('ed').hidden = false;
}
$('ed-list').addEventListener('input', e => {
  const el = e.target; if (!el.dataset.name) return;
  const name = el.dataset.name, k = +el.dataset.k, i = B.findIndex(b => b.name === name);
  const moves = JSON.parse(JSON.stringify(B[i].moves));
  moves[k] = typeof moves[k] === 'string' ? el.value : { sub: el.value };
  edits[name] = moves;
  if (JSON.stringify(moves) === JSON.stringify(ORIG[i])) delete edits[name];
  try { localStorage.setItem(OKEY, JSON.stringify(edits)); } catch (x) {}
  applyEdits(); el.classList.toggle('chg', !!edits[name]);
  if (shownBlock !== 'sum') { const cur = started() ? st.seq : sel; renderBlock(cur); shownBlock = cur; }
});
$('b-edit').addEventListener('click', openEditor);
$('ed-close').addEventListener('click', () => { $('ed').hidden = true; });
$('ed-reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Tryck igen för att återställa'; setTimeout(() => { b.dataset.sure = ''; b.textContent = '↺ Återställ originalet'; }, 3000); return; }
  b.dataset.sure = ''; b.textContent = '↺ Återställ originalet';
  edits = {}; try { localStorage.removeItem(OKEY); } catch (x) {}
  applyEdits(); openEditor(); if (shownBlock !== 'sum') { const cur = started() ? st.seq : sel; renderBlock(cur); shownBlock = cur; }
});
document.addEventListener('pointerdown', e => { ac(); if (!e.target.closest('.ctl') && !e.target.closest('.tl') && !e.target.closest('#b-done') && !e.target.closest('#ed') && !e.target.closest('#rs') && !e.target.closest('.tabs') && !e.target.closest('#undo')) { $('ctl').classList.remove('hide'); hideSoon(); } });
const wake = () => navigator.wakeLock?.request('screen').catch(() => {});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
tick(); if (started()) hideSoon();
})();
</script>
</body>
