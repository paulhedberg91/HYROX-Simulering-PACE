<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PACE Pass-timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PACE Pass">
<meta name="theme-color" content="#0A0F1C">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600;700&family=Big+Shoulders+Display:wght@800;900&display=swap">
<style>
/* Layout: TV/iPad i liggande läge. Vänster: blocket som pågår och rörelserna. Höger: stor nedräkning för blocket. Botten: tidslinje för hela passet. Mörkt tema som i HYROX-appen. */
:root{
  --ink:#0A0F1C; --panel:#111a2c; --panel-2:#172238; --line:#25314c; --text:#eef2fa; --muted:#8e9bb8;
  --b1:#3ba7e6; --b2:#ff8a1f; --rest:#8e9bb8; --b3:#3be08a; --b4:#b18cff; --warn:#ffcf4a;
  --c:var(--b1);
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --u:min(1vw,1.78vh);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(80% 70% at 70% 20%, color-mix(in srgb,var(--c) 14%,var(--ink)) 0%, var(--ink) 70%) fixed, var(--ink);color:var(--text);font-family:var(--font-body);overflow:hidden;transition:background .6s}
button{font:inherit;color:inherit}
.stage{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:calc(var(--u)*2);padding:calc(var(--u)*2.4) max(calc(var(--u)*3.2),env(safe-area-inset-right,0px)) calc(var(--u)*2.2) max(calc(var(--u)*3.2),env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2)}
.brand{display:flex;align-items:center;gap:calc(var(--u)*1.8);min-width:0}
.brand img{height:calc(var(--u)*5.6);width:auto}
.brand .t{border-left:1px solid var(--line);padding-left:calc(var(--u)*1.8);min-width:0}
.brand .t b{display:block;font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:calc(var(--u)*3.2);line-height:1;white-space:nowrap}
.brand .t span{display:block;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:calc(var(--u)*1.2);color:var(--muted);margin-top:.4em}
.clock{font-family:var(--font-num);font-weight:700;font-size:calc(var(--u)*4);line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}

.main{display:grid;grid-template-columns:1.15fr 1fr;gap:calc(var(--u)*2.4);min-height:0}
.card{background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*2.6);min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.4);overflow:hidden}
.tag{align-self:flex-start;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:calc(var(--u)*1.35);padding:.45em 1em;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);border:2px solid var(--c);color:#fff}
.bname{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:calc(var(--u)*6.4);line-height:.92;text-wrap:balance}
.moves{list-style:none;margin:0;padding:0;display:grid;gap:calc(var(--u)*1)}
.moves li{display:grid;grid-template-columns:calc(var(--u)*1.2) 1fr;gap:calc(var(--u)*1.2);align-items:baseline;font-size:calc(var(--u)*2.5);font-weight:600;line-height:1.2}
.moves li::before{content:"";width:calc(var(--u)*1);height:calc(var(--u)*1);border-radius:2px;background:var(--c);transform:translateY(-.15em)}
.moves.roomy li:first-child{font-size:calc(var(--u)*5.2);font-family:var(--font-display);font-weight:900;line-height:1}
.moves.roomy li:first-child::before{width:calc(var(--u)*1.6);height:calc(var(--u)*1.6)}
.moves.dense{gap:calc(var(--u)*.7)}
.moves.dense li{font-size:calc(var(--u)*2.1)}
.moves.dense li.sub{font-size:calc(var(--u)*1.8)}
.moves li.sub{font-size:calc(var(--u)*2);color:var(--muted);font-weight:500}
.moves li.sub::before{background:transparent;border:2px solid var(--line)}
.note{margin-top:auto;color:var(--muted);font-size:calc(var(--u)*1.6);font-weight:600}

.tcard{align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*1.2)}
.tlbl{font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:calc(var(--u)*1.5);color:var(--muted)}
.big{font-family:var(--font-display);font-weight:900;line-height:.85;font-size:calc(var(--u)*17);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 calc(var(--u)*3) color-mix(in srgb,var(--c) 60%,transparent)}
.big.hot{color:var(--c)}
.rounds{display:flex;gap:calc(var(--u)*1)}
.rounds i{font-style:normal;font-family:var(--font-num);font-weight:700;font-size:calc(var(--u)*2.4);width:calc(var(--u)*5);height:calc(var(--u)*5);display:grid;place-items:center;border-radius:calc(var(--u)*1);border:2px solid var(--line);color:var(--muted)}
.rounds i.done{background:color-mix(in srgb,var(--c) 30%,transparent);border-color:var(--c);color:#fff}
.rounds i.now{background:var(--c);border-color:var(--c);color:#06121f}
.total{display:flex;gap:calc(var(--u)*3);font-family:var(--font-num);font-weight:600;font-size:calc(var(--u)*2.2);color:var(--muted);font-variant-numeric:tabular-nums}
.total b{color:var(--text)}
.next{font-size:calc(var(--u)*1.8);color:var(--muted);font-weight:600}
.next b{color:var(--text)}

.bottom{display:grid;gap:calc(var(--u)*1)}
.tl{position:relative;display:flex;height:calc(var(--u)*3.6);border-radius:calc(var(--u)*.9);overflow:hidden;border:1px solid var(--line)}
.tl .seg{cursor:pointer;position:relative;display:flex;align-items:center;padding:0 calc(var(--u)*.8);font-size:calc(var(--u)*1.15);font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;color:#fff;background:color-mix(in srgb,var(--sc) 22%,var(--panel));border-right:1px solid var(--ink)}
.tl .seg:hover{filter:brightness(1.25)}
.tl .seg.past{background:color-mix(in srgb,var(--sc) 55%,var(--panel))}
.tl .now{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;box-shadow:0 0 10px #fff;transition:left .25s linear}
.ticks{position:relative;height:1.3em;font-family:var(--font-num);font-size:calc(var(--u)*1.2);color:var(--muted);font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;transition:opacity .4s}
.ctl.hide{opacity:0;pointer-events:none}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;min-height:46px}
.btn.go{background:var(--b3);border-color:var(--b3);color:#04140b}
.btn.danger{color:#ff5d6c;background:transparent}

/* Nedräkning före start + övergångar */
#ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;align-content:center;text-align:center;gap:2vmin;background:radial-gradient(60% 60% at 50% 50%, color-mix(in srgb,var(--oc,#3ba7e6) 24%,var(--ink)) 0%, var(--ink) 75%)}
#ov .l1{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:clamp(34px,8vmin,100px);padding:.1em .5em;border-radius:.25em;border:.06em solid var(--oc,#3ba7e6);background:color-mix(in srgb,var(--oc,#3ba7e6) 25%,transparent)}
#ov .l2{font-weight:700;letter-spacing:.3em;text-transform:uppercase;font-size:clamp(14px,2.6vmin,28px);color:var(--muted)}
#ov .n{font-family:var(--font-display);font-weight:900;line-height:.85;font-size:min(48vh,46vw);color:#fff;-webkit-text-stroke:.5vmin var(--oc,#3ba7e6);text-shadow:0 0 6vmin var(--oc,#3ba7e6)}
#ov .n.word{font-size:min(30vh,24vw)}
#ov .n.word.long{font-size:min(20vh,11vw)}
#ov.pop .n{animation:slam .5s cubic-bezier(.15,1.15,.35,1)}
@keyframes slam{from{transform:scale(1.35);opacity:.4}to{transform:none;opacity:1}}
#ov .sub{font-size:clamp(14px,2.2vmin,24px);color:var(--muted);font-weight:600}
.hint{position:fixed;left:50%;bottom:calc(var(--u)*9);transform:translateX(-50%);background:rgba(0,0,0,.65);padding:8px 14px;border-radius:999px;font-size:13px;color:#fff;transition:opacity .5s;pointer-events:none}
[hidden]{display:none!important}
@media (max-aspect-ratio:1/1){.main{grid-template-columns:1fr;grid-template-rows:auto auto}.big{font-size:calc(var(--u)*24)}.brand .t span{display:none}}
@media (prefers-reduced-motion:reduce){#ov.pop .n{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <div class="brand"><img src="assets/pace.png" alt="PACE Performance &amp; Training"><div class="t"><b id="w-title"></b><span id="w-format"></span></div></div>
    <div class="clock" id="clock">00:00</div>
  </div>
  <div class="main">
    <div class="card">
      <div class="tag" id="b-tag"></div>
      <div class="bname" id="b-name"></div>
      <ul class="moves" id="b-moves"></ul>
      <div class="note" id="b-note"></div>
    </div>
    <div class="card tcard">
      <div class="tlbl" id="t-lbl">Kvar av blocket</div>
      <div class="big" id="t-big">15:00</div>
      <div class="rounds" id="t-rounds" hidden></div>
      <div class="total"><span>Totalt <b id="t-el">0:00</b></span><span>Kvar till cap <b id="t-left">52:00</b></span></div>
      <div class="next" id="t-next"></div>
    </div>
  </div>
  <div class="bottom">
    <div class="tl" id="tl"><div class="now" id="tl-now"></div></div>
    <div class="ticks" id="ticks"></div>
    <div class="ctl" id="ctl">
      <select class="btn" id="w-pick" aria-label="Välj pass"></select>
      <button class="btn go" type="button" id="b-start">▶ Starta passet (10 s nedräkning)</button>
      <button class="btn" type="button" id="b-prev" aria-label="Föregående block">⏮ Föregående</button>
      <button class="btn" type="button" id="b-pause" hidden>❚❚ Paus</button>
      <button class="btn" type="button" id="b-next" aria-label="Nästa block">Nästa ⏭</button>
      <button class="btn danger" type="button" id="b-reset" hidden>↺ Börja om</button>
    </div>
  </div>
</div>
<div id="ov" hidden><div class="l1" id="ov-l1"></div><div class="l2" id="ov-l2"></div><div class="n" id="ov-n"></div><div class="sub" id="ov-sub"></div></div>
<div class="hint" id="hint" hidden>Tryck på skärmen för att visa knapparna</div>

<script>
(() => {
'use strict';
/* ============ PASSET – ändra här för nästa pass ============ */
// Stationspass: varje station har ett fast tidsfönster – gör jobbet och vila resten av tiden
const ST = [
  [3, 'Row', '500 m', 'b1'], [2, 'DL', '7 reps', 'b2'], [2, 'R-L', '14 reps', 'b2'], [3, 'Ski', '500 m', 'b1'],
  [2, 'S-Press', '7 reps', 'b2'], [2, 'Burpee Place', '14 reps', 'b2'], [3, 'Bike', '1000 m', 'b1'], [3, 'Run', '300–400 m', 'b4'],
];
function stationBlocks(rounds, restMin) {
  const out = []; let t = 0;
  for (let r = 1; r <= rounds; r++) {
    for (const [min, name, work, color] of ST) {
      out.push({ from: t * 60, to: (t + min) * 60, tag: `Varv ${r} av ${rounds} · Min ${t}–${t + min}`, name, color, moves: [work, { sub: 'Vila resten av tiden' }] });
      t += min;
    }
    if (r < rounds) { out.push({ from: t * 60, to: (t + restMin) * 60, tag: `Vila · Min ${t}–${t + restMin}`, name: `Vila ${restMin} min`, color: 'rest', rest: true, moves: [`Nästa: varv ${r + 1}`, 'Gör dig redo vid rodden'] }); t += restMin; }
  }
  return out;
}
const WODS = [
  {
    id: '2026-11-11-0600',
    title: 'Onsdag 11/11 · 06:00',
    format: 'For time · Time cap 52 min · Par',
    cap: 52 * 60,
    blocks: [
      { from: 0, to: 15 * 60, tag: 'Block 1 · Min 0–15', name: 'Front Squats', color: 'b1',
        moves: ['Sätt 1RM – atlet 1', 'Sätt 3RM – atlet 2'] },
      { from: 15 * 60, to: 29 * 60, tag: 'Block 2 · Min 15–29', name: '4 ronder', color: 'b2', rounds: 4,
        moves: ['10 SYNC pull-ups', '18 HPS @ 40/30 kg', '14 box step-ups', { sub: 'Varannan rep: P1 – P2 – P1 – P2' }],
        note: '3:30 per rond' },
      { from: 29 * 60, to: 33 * 60, tag: 'Vila · Min 29–33', name: 'Vila 4 min', color: 'rest', rest: true,
        moves: ['Ställ i ordning bike, ski och row', 'Förbered thrusters, lunges & wallballs'] },
      { from: 33 * 60, to: 36 * 60, tag: 'Block 3 · Min 33–52 · X-distance ladder', name: 'Bike erg 3 min', color: 'b3',
        moves: ['3 min bike erg', { sub: 'Notera distansen = X' }] },
      { from: 36 * 60, to: 52 * 60, tag: 'Block 3 · X-distance ladder', name: 'Ladder', color: 'b3',
        moves: ['Ski erg: halva bike-distansen', 'Row erg: 3 min', 'Bike erg: dubbla distansen', { sub: 'Resten av tiden – 21-15-9-15-21:' }, 'Thrusters · OH R-lunges · Wallballs'],
        note: 'Kör tills time cap 52:00' },
    ],
  },
  {
    id: '2026-11-stationer-2x20',
    title: 'Stationspass · 2 varv',
    format: '20 min stationer · 4 min vila · 44 min',
    cap: 44 * 60,
    blocks: stationBlocks(2, 4),
  },
];
// Valt pass: adressens #id, annars senast valda, annars det senaste i listan
let selId = location.hash.slice(1);
try { selId = selId || localStorage.getItem('pace-pass-sel') || ''; } catch (e) {}
const WOD = WODS.find(w => w.id === selId) || WODS[WODS.length - 1];
/* =========================================================== */

const KEY = 'pace-pass-' + WOD.id;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmt = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colorOf = b => `var(--${b.color})`;
const CD = 10;   // sekunders nedräkning före start

// Tillstånd: startedAt (ms när 0:00 var), pausedAt, sparas så att omladdning inte stoppar klockan
let st = { startedAt: null, pausedAt: null };
try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const elapsed = () => st.startedAt == null ? null : ((st.pausedAt || Date.now()) - st.startedAt) / 1000;

$('w-title').textContent = WOD.title; $('w-format').textContent = WOD.format;
$('w-pick').innerHTML = WODS.map(w => `<option value="${w.id}"${w.id === WOD.id ? ' selected' : ''}>${esc(w.title)}</option>`).join('');
$('w-pick').addEventListener('change', e => { try { localStorage.setItem('pace-pass-sel', e.target.value); } catch (x) {} location.hash = e.target.value; location.reload(); });

// Tidslinje
const tl = $('tl');
tl.insertAdjacentHTML('afterbegin', WOD.blocks.map((b, i) => `<div class="seg" data-i="${i}" style="flex:${b.to - b.from};--sc:${colorOf(b)}">${esc(b.rest ? 'Vila' : b.name)}</div>`).join(''));
const segs = [...tl.querySelectorAll('.seg')];
const marks = [0, ...WOD.blocks.map(b => b.to)];
$('ticks').innerHTML = [...new Set(marks)].map(m => `<span style="position:absolute;left:${m / WOD.cap * 100}%;transform:translateX(${m === 0 ? '0' : m === WOD.cap ? '-100%' : '-50%'})">${m / 60}</span>`).join('');

// Ljud
let audio;
function ac() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch (e) {} return audio; }
function tone(f, d, vol = .25, type = 'triangle') {
  const a = ac(); if (!a) return;
  const t = a.currentTime + .01, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05);
}
const beepShort = () => tone(660, .16, .3, 'square');
const beepLong = () => tone(990, .7, .3, 'square');

// Visa block
let shownBlock = -1, shownRound = -1, lastBeep = null;
function blockAt(t) { return WOD.blocks.findIndex(b => t >= b.from && t < b.to); }
function renderBlock(i) {
  const b = WOD.blocks[i];
  document.documentElement.style.setProperty('--c', colorOf(b));
  $('b-tag').textContent = b.tag; $('b-name').textContent = b.name;
  $('b-moves').classList.toggle('dense', b.moves.length > 4);
  $('b-moves').classList.toggle('roomy', b.moves.length <= 2 && !b.rest);
  $('b-moves').innerHTML = b.moves.map(m => typeof m === 'string' ? `<li>${esc(m)}</li>` : `<li class="sub">${esc(m.sub)}</li>`).join('');
  $('b-note').textContent = b.note || '';
  $('t-rounds').hidden = !b.rounds;
  if (b.rounds) $('t-rounds').innerHTML = Array.from({ length: b.rounds }, (_, k) => `<i>${k + 1}</i>`).join('');
}

// Övergångsskylt (kort, utan blink)
let ovT;
function flashCard(l1, l2, word, color, ms = 2200) {
  const ov = $('ov'); clearTimeout(ovT);
  ov.style.setProperty('--oc', color);
  $('ov-l1').textContent = l1; $('ov-l2').textContent = l2 || ''; $('ov-n').textContent = word; $('ov-n').className = 'n word' + (word.length > 6 ? ' long' : ''); $('ov-sub').textContent = '';
  ov.hidden = false; ov.classList.remove('pop'); void ov.offsetWidth; ov.classList.add('pop');
  ovT = setTimeout(() => ov.hidden = true, ms);
}

function tick() {
  const now = new Date();
  $('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const t = elapsed();
  const running = st.startedAt != null && !st.pausedAt;
  $('b-start').hidden = st.startedAt != null; $('w-pick').hidden = st.startedAt != null; $('b-pause').hidden = st.startedAt == null; $('b-prev').hidden = st.startedAt == null; $('b-reset').hidden = st.startedAt == null;
  $('b-pause').textContent = st.pausedAt ? '▶ Fortsätt' : '❚❚ Paus';

  // Före start / nedräkning
  if (t == null || t < 0) {
    if (shownBlock !== 0) { renderBlock(0); shownBlock = 0; }
    $('t-big').textContent = fmt(WOD.blocks[0].to - WOD.blocks[0].from);
    $('t-lbl').textContent = 'Kvar av blocket'; $('t-el').textContent = '0:00'; $('t-left').textContent = fmt(WOD.cap);
    $('t-next').innerHTML = `Nästa: <b>${esc(WOD.blocks[1].name)}</b>`;
    $('tl-now').style.left = '0%'; segs.forEach(s => s.classList.remove('past'));
    if (t != null) {   // nedräkningen pågår
      const s = Math.ceil(-t), ov = $('ov');
      const col = s > 5 ? 'var(--b1)' : s > 1 ? 'var(--b2)' : 'var(--b3)';
      ov.hidden = false; ov.style.setProperty('--oc', col);
      $('ov-l1').textContent = WOD.title.split('·')[0].trim(); $('ov-l2').textContent = 'Startar om';
      if ($('ov-n').textContent !== String(s)) {
        $('ov-n').textContent = s; $('ov-n').className = 'n'; ov.classList.remove('pop'); void ov.offsetWidth; ov.classList.add('pop');
        $('ov-sub').textContent = WOD.blocks[0].name;
        if (s <= 3 && lastBeep !== 'cd' + s) { lastBeep = 'cd' + s; beepShort(); }
      }
    }
    return;
  }

  // Start (0:00) – GOGO en gång
  if (lastBeep !== 'go' && t < 2) { lastBeep = 'go'; beepLong(); flashCard(WOD.blocks[0].tag, '', 'GOGO!', 'var(--b3)', 1800); }

  if (t >= WOD.cap) {   // time cap
    $('t-big').textContent = '0:00'; $('t-lbl').textContent = 'Time cap'; $('t-el').textContent = fmt(WOD.cap); $('t-left').textContent = '0:00';
    $('tl-now').style.left = '100%'; segs.forEach(s => s.classList.add('past'));
    $('t-next').innerHTML = '<b>Bra jobbat!</b>';
    if (lastBeep !== 'cap') { lastBeep = 'cap'; beepLong(); flashCard('Time cap', WOD.title, 'TIME!', 'var(--warn)', 6000); }
    return;
  }

  const i = blockAt(t), b = WOD.blocks[i];
  if (i !== shownBlock) {
    renderBlock(i);
    if (shownBlock !== -1 && t > 1) { beepLong(); flashCard(b.tag, '', b.rest ? 'VILA' : b.name.toUpperCase(), colorOf(b), 1800); }
    shownBlock = i; shownRound = -1;
  }
  let left = b.to - t, lbl = b.rest ? 'Vila kvar' : 'Kvar av blocket';
  if (b.rounds) {   // ronder med egen nedräkning
    const len = (b.to - b.from) / b.rounds, r = Math.min(b.rounds - 1, Math.floor((t - b.from) / len));
    left = b.from + (r + 1) * len - t; lbl = `Rond ${r + 1} av ${b.rounds} · kvar`;
    [...$('t-rounds').children].forEach((el, k) => el.className = k < r ? 'done' : k === r ? 'now' : '');
    if (r !== shownRound) { if (shownRound !== -1) { beepLong(); flashCard(b.tag, '', `ROND ${r + 1}`, colorOf(b), 1600); } shownRound = r; }
  }
  $('t-lbl').textContent = lbl;
  $('t-big').textContent = fmt(left);
  $('t-big').classList.toggle('hot', left <= 10);
  const sLeft = Math.ceil(left);
  if (sLeft <= 3 && sLeft >= 1 && running && lastBeep !== `b${i}-${shownRound}-${sLeft}`) { lastBeep = `b${i}-${shownRound}-${sLeft}`; beepShort(); }
  $('t-el').textContent = fmt(Math.floor(t)); $('t-left').textContent = fmt(WOD.cap - t);
  const nb = WOD.blocks[i + 1];
  $('t-next').innerHTML = nb ? `Nästa: <b>${esc(nb.name)}</b> om ${fmt(b.to - t)}` : 'Kör tills time cap';
  $('tl-now').style.left = (t / WOD.cap * 100).toFixed(2) + '%';
  segs.forEach((s, k) => s.classList.toggle('past', WOD.blocks[k].to <= t));
}
setInterval(tick, 200);

// Knappar
$('b-start').addEventListener('click', () => { ac(); st = { startedAt: Date.now() + CD * 1000, pausedAt: null }; lastBeep = null; shownBlock = -1; save(); tick(); hideSoon(); wake(); });
$('b-pause').addEventListener('click', () => {
  if (st.pausedAt) { st.startedAt += Date.now() - st.pausedAt; st.pausedAt = null; } else st.pausedAt = Date.now();
  save(); tick();
});
let confirmT;
$('b-reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (b.dataset.sure) { st = { startedAt: null, pausedAt: null }; save(); shownBlock = -1; lastBeep = null; $('ov').hidden = true; b.dataset.sure = ''; b.textContent = '↺ Börja om'; tick(); return; }
  b.dataset.sure = '1'; b.textContent = 'Tryck igen för att börja om'; clearTimeout(confirmT); confirmT = setTimeout(() => { b.dataset.sure = ''; b.textContent = '↺ Börja om'; }, 3000);
});
// Knapparna göms medan passet går – tryck för att visa
let hideT;
function hideSoon() { clearTimeout(hideT); hideT = setTimeout(() => { if (st.startedAt != null && !st.pausedAt) { $('ctl').classList.add('hide'); } }, 4000); }
// Hoppa till valfritt block: knapparna eller ett tryck på tidslinjen
function jumpTo(i) {
  i = Math.max(0, Math.min(WOD.blocks.length - 1, i));
  const from = WOD.blocks[i].from * 1000, now = Date.now();
  ac(); $('ov').hidden = true; clearTimeout(ovT);
  if (st.startedAt == null || elapsed() < 0) st = { startedAt: now - from, pausedAt: null };   // inte startat än: starta direkt i blocket
  else if (st.pausedAt) st.startedAt = st.pausedAt - from;
  else st.startedAt = now - from;
  if (i > 0) lastBeep = 'go';                // ingen GOGO när man hoppar in mitt i passet
  save(); tick(); hideSoon(); wake();
}
function curBlock() { const t = elapsed(); if (t == null || t < 0) return 0; const i = blockAt(t); return i < 0 ? WOD.blocks.length : i; }
$('b-next').addEventListener('click', () => jumpTo(curBlock() + 1));
$('b-prev').addEventListener('click', () => {
  const i = curBlock(), t = elapsed();
  // tryck en gång = början av blocket, inom 3 s = föregående block
  if (i >= 0 && i < WOD.blocks.length && t - WOD.blocks[i].from > 3) jumpTo(i); else jumpTo(i - 1);
});
segs.forEach((el, k) => el.addEventListener('click', () => jumpTo(k)));
document.addEventListener('pointerdown', e => { ac(); if (!e.target.closest('.ctl') && !e.target.closest('.tl')) { $('ctl').classList.remove('hide'); hideSoon(); } });
const wake = () => navigator.wakeLock?.request('screen').catch(() => {});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
tick(); if (st.startedAt != null) hideSoon();
})();
</script>
</body>
